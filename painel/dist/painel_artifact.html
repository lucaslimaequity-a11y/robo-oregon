lina nos preços e a geração de valor por cota são fundamentais."}],"numeros":["Em agosto de 2026, o NOI caixa por m² cresceu 6,3% a/a e a vacância atingiu 5,1%. O resultado de R$ 33,7 milhões ficou abaixo dos R$ 59,2 milhões distribuídos, reduzindo o resultado acumulado não distribuído para R$ 1,51 por cota."],"indicadores":["Vendas, aluguéis, vacância e inadimplência","NOI, resultado recorrente, rendimentos e reservas","Reciclagem de ativos, recebíveis e endividamento"],"riscos":[{"titulo":"Rendimento acima do recorrente","texto":"Distribuições acima do resultado recorrente dependem de reservas ou ganhos com vendas, que podem não se repetir. A continuidade desse cenário pode exigir redução dos rendimentos."},{"titulo":"Consumo e juros","texto":"Juros altos, crédito restrito e recuperações judiciais de varejistas podem reduzir vendas, ocupação e aluguéis."},{"titulo":"Recebíveis de vendas","texto":"Parte das vendas de shoppings será paga a prazo, o que expõe o fundo à capacidade de pagamento dos compradores."},{"titulo":"Dívida e obrigações","texto":"CRIs e parcelas de aquisições representam compromissos futuros. Juros elevados e descasamentos entre pagamentos e recebimentos podem pressionar o caixa."}],"criterios":["Queda persistente de vendas, ocupação ou resultado operacional dos principais shoppings.","Rendimentos sustentados por reservas ou ganhos não recorrentes por períodos prolongados, sem crescimento compatível do resultado operacional por cota.","Cotação que já incorpore o valor dos shoppings e a renda esperada, sem retorno potencial suficiente diante dos riscos."],"fontes":"Fontes: XP Malls FII, relatório gerencial de setembro de 2026, com dados operacionais de agosto; documentos oficiais no Fundos.NET/B3 (fnet.bmfbovespa.com.br)."},"TRXF11":{"pagina":22,"pilar_crumb":"PILAR 7 · FUNDOS LISTADOS / TIJOLO · MULTICATEGORIA","nome":"TRX Real Estate","ticker":"TRXF11","peso":"12,5% do Pilar 7","resumo":"O TRXF11 combina renda imobiliária de longo prazo com gestão ativa de um portfólio multicategoria. A expansão em logística, varejo, shoppings e outros segmentos amplia a diversificação, enquanto contratos de longo prazo, reciclagem de ativos e disciplina financeira sustentam a estratégia de geração de valor.","papel_titulo":"Exposição large cap a tijolo multicategoria","papel":"Combina renda contratual, diversificação entre segmentos e potencial de valorização. A escala amplia as oportunidades, mas exige disciplina nas aquisições, na integração dos ativos e na estrutura de capital.","questao":"O TRXF11 conseguirá transformar sua expansão em maior geração de valor por cota, preservando a renda contratual e reduzindo a alavancagem?","fundamentos":[{"titulo":"Diversificação multicategoria","texto":"Logística e varejo formam as principais exposições, complementadas por shoppings, saúde, educação, hotelaria e outros segmentos. A diversificação reduz a dependência de um único mercado."},{"titulo":"Contratos longos e atípicos","texto":"Contratos atípicos oferecem prazos extensos e multas mais rígidas, favorecendo a previsibilidade. A maior participação de contratos típicos exige atenção às renovações, aos reajustes e à vacância."},{"titulo":"Reciclagem de ativos","texto":"A gestão compra, desenvolve e vende imóveis conforme as oportunidades. A reciclagem realiza ganhos e reinveste recursos, desde que as aquisições ofereçam retornos adequados e criem valor por cota."}],"numeros":["Em setembro de 2026, o fundo reunia 129 imóveis, 2,05 milhões de m² de ABL e 1.375 locatários. Vacância financeira de 0,3%, WALE de 11,1 anos e 56,5% da receita em contratos atípicos. Alavancagem líquida em escopo amplo de 27,5%."],"indicadores":["Vacância, WALE e renovação dos contratos","Resultado recorrente e rendimentos por cota","Alavancagem, amortizações e concentração"],"riscos":[{"titulo":"Alavancagem e juros","texto":"Financiamentos e parcelas futuras de aquisições ampliam a sensibilidade aos juros e exigem disciplina no caixa e nas amortizações."},{"titulo":"Crédito e renovação","texto":"Contratos longos não eliminam inadimplência, renegociações ou vacância. A maior exposição a contratos típicos exige acompanhamento."},{"titulo":"Execução e integração","texto":"A rápida expansão para novos segmentos aumenta a complexidade operacional e o risco de aquisições com retorno insuficiente."},{"titulo":"Preço e compensações","texto":"Compras pagas com cotas exigem atenção ao preço dos imóveis, ao valor de emissão e às compensações, para evitar diluição econômica."}],"criterios":["Deterioração persistente da ocupação, da qualidade dos locatários ou da geração de caixa recorrente por cota.","Alavancagem sem convergência para níveis sustentáveis, compromissos que pressionem o caixa ou aquisições e emissões que destruam valor por cota.","Cotação que já incorpore a renda contratual e os ganhos esperados com a reciclagem, sem retorno potencial suficiente diante dos riscos."],"fontes":"Fontes: TRXF11, relatório gerencial de setembro de 2026, publicado em 06/10/2026; TRX Investimentos, apresentação pós-13ª emissão. Alavancagem líquida em escopo amplo, métrica da gestora: financiamentos, compromissos com vendedores e obras, líquidos dos ativos considerados."},"MCRE11":{"pagina":23,"pilar_crumb":"PILAR 7 · FUNDOS LISTADOS / CRÉDITO · MULTIESTRATÉGIA","nome":"Mauá Capital","ticker":"MCRE11","peso":"15% do Pilar 7","resumo":"O Mauá Capital Real Estate combina CRIs de maior retorno, fundos imobiliários estruturados e imóveis. Parte da carteira gera juros e correção monetária, enquanto outra busca ganhos de capital com a maturação dos investimentos. O maior retorno potencial vem acompanhado de riscos adicionais de crédito, execução e liquidez.","papel_titulo":"Renda elevada atrelada à inflação","papel":"Complementa fundos de crédito mais conservadores com operações de taxas maiores e investimentos estruturados com potencial de valorização. Em troca, assume mais riscos de crédito, concentração e liquidez.","questao":"O carrego e os ganhos dos investimentos estruturados bastarão para sustentar os rendimentos e preservar o patrimônio, sem perdas relevantes de crédito?","fundamentos":[{"titulo":"Crédito de maior retorno","texto":"A estratégia busca CRIs com taxas superiores às de operações tradicionais. A seleção considera capacidade de pagamento, garantias e estrutura de proteção, buscando retornos que compensem o risco adicional."},{"titulo":"Garantias e estruturação","texto":"Os CRIs contam com garantias e mecanismos de proteção, mas o LTV e a subordinação variam entre operações. A qualidade das garantias e a capacidade de recuperação em cenários adversos são fundamentais."},{"titulo":"Carrego e ganhos de capital","texto":"Juros e correção monetária sustentam o carrego, enquanto imóveis e fundos estruturados podem gerar ganhos na maturação ou venda. Esses resultados dependem da execução e não são necessariamente recorrentes."}],"numeros":["Em agosto de 2026, os CRIs representavam 48% da carteira e imóveis e FIIs estruturados, 43%. O carrego médio estimado era de IPCA + 9,9% ao ano, antes de ganhos de capital. O LTV médio dos CRIs era de 56%, e as reservas somavam cerca de R$ 0,12 por cota, incluindo veículos intermediários."],"indicadores":["Adimplência, LTV e subordinação das operações","Resultado recorrente, distribuição e reservas","Concentração, liquidez e ganhos realizados"],"riscos":[{"titulo":"Crédito e subordinação","texto":"Operações de maior retorno têm riscos adicionais. CRIs com LTV elevado e posições subordinadas podem sofrer perdas relevantes na inadimplência."},{"titulo":"Concentração e exposição indireta","texto":"O TRXF11, cerca de 13,6% do fundo, amplia a exposição indireta da Oregon. O MCLO11, cerca de 7,7%, tem risco de locatários, como a Casas Bahia."},{"titulo":"Liquidez e realização dos investimentos","texto":"Imóveis e fundos estruturados têm menor liquidez. Os ganhos dependem da maturação ou venda, sujeitas a atrasos e preços abaixo do esperado."},{"titulo":"Inflação e sustentabilidade dos rendimentos","texto":"Inflação menor reduz o carrego. Distribuições acima do resultado recorrente dependem de reservas ou ganhos extraordinários."}],"criterios":["Inadimplência, reestruturações ou deterioração das garantias que provoquem perdas relevantes.","Rendimentos persistentemente superiores à geração recorrente, com consumo de reservas ou dificuldade para realizar os ganhos previstos dos ativos estruturados.","Cotação que já incorpore a renda e os ganhos potenciais, sem oferecer retorno suficiente para compensar os riscos de crédito, execução e liquidez."],"fontes":"Fontes: JiveMauá, relatório mensal de setembro de 2026 (data-base agosto de 2026); comunicados oficiais do MCRE11 sobre os investimentos em TRXF11 e MCLO11; Fundos.NET/B3."},"KNSC11":{"pagina":24,"pilar_crumb":"PILAR 7 · FUNDOS LISTADOS / CRÉDITO · RECEBÍVEIS IMOBILIÁRIOS","nome":"Kinea Securities","ticker":"KNSC11","peso":"7,5% do Pilar 7","resumo":"O Kinea Securities investe em CRIs atrelados ao CDI e ao IPCA, estruturados com garantias reais. A gestão da Kinea, do grupo Itaú Unibanco, combina operações corporativas de galpões, escritórios e shoppings com créditos residenciais pulverizados.","papel_titulo":"Crédito imobiliário diversificado","papel":"Oferece renda mensal com risco distribuído em mais de 80 operações, de devedores e setores distintos, e equilibra o bloco de crédito com uma carteira dividida entre CDI e IPCA.","questao":"A diversificação e a qualidade do crédito permitirão sustentar os rendimentos, preservando o patrimônio mesmo diante das oscilações dos juros e da inflação?","fundamentos":[{"titulo":"Dois indexadores","texto":"Papéis em CDI acompanham os juros, e papéis em IPCA protegem contra a inflação. A combinação equilibra a renda ao longo do ciclo de juros."},{"titulo":"Garantias reais","texto":"As operações contam com garantias reais, cessão de recebíveis, fundos de reserva e covenants. A análise da capacidade de pagamento e a qualidade das garantias são essenciais para preservar o capital."},{"titulo":"Pulverização residencial","texto":"Créditos residenciais pulverizados, como home equity, diluem o risco por devedor e se somam a operações de galpões, escritórios e shoppings."}],"numeros":["Em setembro de 2026, 57,9% do patrimônio estava em CRIs indexados ao IPCA, com taxa média a mercado de IPCA + 10,06% a.a., e 31,8% em CRIs CDI, a CDI + 2,91%. O resultado foi de R$ 0,06 por cota, frente à distribuição de R$ 0,08, deixando reserva de R$ 0,04 por cota."],"indicadores":["Adimplência, provisões e qualidade das garantias","Resultado recorrente, distribuição e reservas","Spreads de crédito, duration e concentração"],"riscos":[{"titulo":"Inflação e defasagem","texto":"Os CRIs em IPCA refletem a inflação com defasagem, pressionando rendimentos com índices baixos ou negativos. Juros menores também reduzem o carrego dos papéis em CDI."},{"titulo":"Crédito e garantias","texto":"Inadimplência e reestruturações podem gerar provisões e perdas. As ocorrências no varejo em 2026 demonstram que garantias não eliminam o risco de crédito."},{"titulo":"Reservas e alocação","texto":"Distribuições superiores ao resultado consomem reservas. Recursos de emissões ainda não alocados podem reduzir temporariamente a geração de renda por cota."},{"titulo":"Marcação a mercado e subordinação","texto":"Abertura de taxas e spreads pode pressionar as cotas mesmo sem inadimplência. Posições mezanino apresentam maior exposição a perdas que as tranches seniores."}],"criterios":["Deterioração persistente do crédito, aumento de provisões ou perda de efetividade das garantias.","Rendimentos sustentados por consumo recorrente das reservas, sem recuperação compatível do resultado, ou alocação de capital com retornos insuficientes.","Cotação que já incorpore a renda esperada, sem prêmio suficiente para compensar os riscos de crédito, juros e marcação a mercado."],"fontes":"Fontes: Kinea Securities, relatório gerencial de setembro de 2026, divulgado em 09/10/2026; demonstrações financeiras do KNSC11 do exercício encerrado em junho de 2026; documentos oficiais da Kinea e Fundos.NET/B3."},"KNCA11":{"pagina":25,"pilar_crumb":"PILAR 7 · FUNDOS LISTADOS / CRÉDITO · FIAGRO","nome":"Kinea Crédito Agro","ticker":"KNCA11","peso":"7,5% do Pilar 7","resumo":"O Kinea Crédito Agro investe em crédito ligado às cadeias agroindustriais, principalmente por meio de CRAs, CPR-F e fundos de recebíveis. A estratégia prioriza devedores corporativos de maior porte, combinando operações indexadas ao CDI e ao IPCA, com gestão especializada.","papel_titulo":"Agronegócio com renda de crédito","papel":"Acrescenta exposição ao crédito corporativo do agronegócio, com devedores de diferentes cadeias produtivas. A combinação de CDI e IPCA diversifica as fontes de rendimento e reduz a dependência exclusiva do mercado imobiliário.","questao":"A qualidade do crédito e a gestão ativa permitirão preservar o patrimônio e sustentar os rendimentos, mesmo em ciclos adversos do agronegócio?","fundamentos":[{"titulo":"Devedores de grande porte","texto":"Usinas de açúcar e etanol, cooperativas agrícolas, indústrias de alimentos, papel e celulose e outros grupos de maior porte diversificam a exposição às cadeias do agronegócio."},{"titulo":"Garantias e estrutura","texto":"Alienação fiduciária, cessão de recebíveis, avais, fundos de reserva e covenants oferecem proteção adicional. A capacidade de pagamento dos devedores continua sendo fundamental."},{"titulo":"Gestão ativa de crédito","texto":"A Kinea acompanha os devedores, monitora riscos e ajusta posições diante de mudanças na qualidade do crédito. A disciplina na seleção das operações busca preservar o patrimônio e os rendimentos."}],"numeros":["Em setembro de 2026, 86% do PL estava em ativos-alvo, com 42,5% indexados ao IPCA e 40,2% ao CDI. Sucroenergia representava 24,1% do patrimônio. Todos os créditos estavam adimplentes; o resultado e a distribuição foram de R$ 0,93 por cota, com reserva acumulada de R$ 0,67."],"indicadores":["Adimplência, provisões e qualidade dos devedores","Resultado recorrente, distribuição e reservas","Concentração, spreads de crédito e alocação"],"riscos":[{"titulo":"Ciclo do agronegócio","texto":"Preços das commodities, clima, juros e condições de crédito afetam o caixa dos devedores, especialmente em setores mais cíclicos."},{"titulo":"Concentração setorial","texto":"A exposição relevante a sucroenergia e a grandes grupos empresariais aumenta a sensibilidade a dificuldades específicas dessas cadeias."},{"titulo":"Marcação a mercado","texto":"Deterioração da qualidade de crédito ou abertura dos spreads pode reduzir o valor dos papéis, mesmo sem inadimplência."},{"titulo":"Caixa e indexação","texto":"Pré-pagamentos podem elevar o caixa e reduzir temporariamente o carrego. Inflação e CDI menores também pressionam os rendimentos."}],"criterios":["Inadimplência, reestruturações ou deterioração persistente da qualidade financeira dos principais devedores, com risco de perdas patrimoniais.","Concentração excessiva, alocação de capital com retorno insuficiente ou rendimentos sustentados por consumo recorrente das reservas.","Cotação que já incorpore a renda e os ganhos esperados, sem oferecer prêmio suficiente para compensar os riscos de crédito e concentração."],"fontes":"Fontes: Kinea Crédito Agro, relatório gerencial de setembro de 2026, divulgado em 09/10/2026; Kinea Investimentos, documentos e informações oficiais do KNCA11; Fundos.NET/B3."},"CDII11":{"pagina":26,"pilar_crumb":"PILAR 7 · FUNDOS LISTADOS / CRÉDITO · FI-INFRA CDI","nome":"Sparta Infra CDI","ticker":"CDII11","peso":"10% do Pilar 7","resumo":"O CDII11 investe em debêntures incentivadas de infraestrutura e usa hedge com DAP para obter exposição econômica ao CDI mais um prêmio de crédito. A estratégia busca renda e retorno acima do CDI, sem eliminar os riscos de crédito, marcação a mercado e volatilidade patrimonial.","papel_titulo":"Renda fixa de infraestrutura ligada ao CDI","papel":"Oferece exposição ao crédito de infraestrutura com retorno econômico atrelado ao CDI e eficiência tributária para pessoas físicas. Complementa os fundos indexados à inflação, com emissores diversificados e gestão ativa.","questao":"O fundo conseguirá transformar o carrego da carteira em retorno efetivo acima do CDI, controlando os riscos de crédito, hedge e preservação patrimonial?","fundamentos":[{"titulo":"Exposição econômica ao CDI","texto":"As debêntures são predominantemente indexadas ao IPCA, enquanto o DAP busca converter a exposição aos juros reais em CDI. O retorno depende do indexador, do prêmio de crédito e da gestão, descontados os custos."},{"titulo":"Diversificação e qualidade de crédito","texto":"Mais de 380 posições em debêntures de energia, transportes, telecom e outros setores diluem riscos individuais. Predominam ratings elevados, mas a carteira segue exposta a perdas e reprecificações de crédito."},{"titulo":"Gestão e eficiência tributária","texto":"A Sparta seleciona emissores, acompanha os riscos e administra os hedges. A gestão busca prêmios de crédito adequados; rendimentos e ganhos de capital são isentos de IR para pessoas físicas, nas condições legais."}],"numeros":["Em setembro de 2026, 93% da carteira estava em debêntures incentivadas e 7% em caixa. O carrego estimado era CDI + 1,1% a.a., com duration do spread de crédito de 4,7 anos. A distribuição foi de R$ 1,00 por cota, sem garantia de renda futura."],"indicadores":["Retorno patrimonial versus CDI, líquido de custos","Spreads, duration e qualidade do crédito","Hedge, liquidez e sustentabilidade das distribuições"],"riscos":[{"titulo":"Hedge e risco de base","texto":"Diferenças de prazo, sensibilidade e volume entre debêntures e DAP podem gerar descasamentos. O hedge não elimina o risco de crédito."},{"titulo":"Risco de crédito e spreads","texto":"Inadimplência, rebaixamentos de rating e abertura dos spreads podem reduzir o valor patrimonial, mesmo sem perdas efetivas."},{"titulo":"Ajustes e liquidez","texto":"Os derivativos exigem ajustes e caixa disponível. Em períodos de estresse, podem aumentar a necessidade de liquidez e os custos da estratégia."},{"titulo":"Distribuições e patrimônio","texto":"Desde abril de 2026, o fundo pode distribuir com cota patrimonial abaixo de R$ 100, inclusive com amortizações, o que exige atenção ao patrimônio."}],"criterios":["Deterioração relevante da qualidade de crédito, aumento de perdas ou spreads insuficientes para remunerar os riscos e custos da estratégia.","Descasamentos persistentes do hedge, retorno líquido sistematicamente insuficiente frente ao CDI ou distribuições que comprometam a preservação patrimonial.","Cotação que já incorpore o retorno esperado, sem prêmio suficiente para compensar os riscos de crédito, liquidez e marcação a mercado."],"fontes":"Fontes: Sparta, relatórios gerenciais do CDII11 de setembro de 2026 (divulgado em 05/10/2026) e de abril de 2026 (nova política de distribuição); regulamento e documentos oficiais na B3."},"JURO11":{"pagina":27,"pilar_crumb":"PILAR 7 · FUNDOS LISTADOS / CRÉDITO · FI-INFRA IPCA","nome":"Sparta Infra","ticker":"JURO11","peso":"12,5% do Pilar 7","resumo":"O JURO11 investe em debêntures incentivadas de infraestrutura, combinando proteção inflacionária, prêmios de crédito e gestão ativa de juros reais. A estratégia busca retorno acima dos títulos públicos de prazo semelhante, mas permanece exposta à marcação a mercado, à qualidade dos emissores e às oscilações das taxas.","papel_titulo":"Infraestrutura com proteção inflacionária","papel":"Complementa a exposição ao CDI com uma carteira de crédito ligada à inflação e aos juros reais. A gestão ativa busca capturar prêmios adicionais, enquanto a eficiência tributária favorece o retorno líquido de longo prazo.","questao":"O fundo conseguirá superar o IMA-B 5 no longo prazo, administrando os riscos de juros reais e crédito, com distribuições sustentáveis?","fundamentos":[{"titulo":"Proteção inflacionária e carrego","texto":"A carteira reúne debêntures incentivadas com retorno ligado ao IPCA e juros reais, mais prêmios de crédito. O carrego tem potencial de retorno adicional, sujeito à qualidade dos emissores e às oscilações de mercado."},{"titulo":"Diversificação e qualidade de crédito","texto":"A carteira distribui o risco entre emissores de energia, transportes, saneamento e outros setores. Predominam ratings elevados, mas a concentração setorial e a qualidade de cada operação exigem acompanhamento."},{"titulo":"Gestão ativa e eficiência tributária","texto":"A Sparta seleciona emissores e ajusta a exposição aos juros reais conforme as oportunidades. A gestão da duration pode gerar ganhos ou perdas; rendimentos e ganhos de capital são isentos de IR para pessoa física, nos termos da lei."}],"numeros":["Em setembro de 2026, o carrego estimado era de IPCA + 9,1% a.a., com spread de crédito de 1,5%. A duration de mercado era de 3,5 anos e a de crédito, 5,0 anos. Geração e distribuição de energia representavam 43% da carteira."],"indicadores":["Retorno patrimonial versus IMA-B 5","Juros reais, duration e spreads de crédito","Qualidade dos emissores, reservas e distribuições"],"riscos":[{"titulo":"Juros reais e duration","texto":"A alta dos juros reais reduz o valor dos ativos; a duration amplifica as oscilações, e desvios do benchmark podem gerar ganhos ou perdas."},{"titulo":"Risco de crédito e spreads","texto":"Inadimplência, rebaixamentos de rating e abertura dos spreads podem pressionar o patrimônio, mesmo sem perdas efetivas."},{"titulo":"Concentração setorial","texto":"A exposição relevante ao setor elétrico aumenta a sensibilidade a riscos regulatórios, financeiros e operacionais das empresas de infraestrutura."},{"titulo":"Distribuições e patrimônio","texto":"A distribuição considera o resultado acumulado e a preservação patrimonial. Oscilações de mercado podem reduzir ou suspender os pagamentos."}],"criterios":["Deterioração relevante do crédito, perdas ou spreads insuficientes para compensar os riscos.","Gestão da duration persistentemente inadequada, desempenho estruturalmente inferior ao benchmark ou distribuições que comprometam a preservação patrimonial.","Cotação que já incorpore o carrego e os ganhos esperados com juros menores, sem retorno potencial suficiente diante dos riscos."],"fontes":"Fontes: Sparta Infra, relatório gerencial do JURO11 de setembro de 2026, divulgado em 05/10/2026."}},"intro":{"filosofia":{"titulo":"Nossa filosofia","texto":"A carteira combina análise fundamentalista, visão de longo prazo e disciplina de preço. As empresas e os fundos são selecionados pelo valor que podem gerar e pela função que cumprem no conjunto."},"pilares":[{"titulo":"Pilar 5 · Dividendos","texto":"Negócios consolidados, sobretudo de atividades essenciais, que conseguem gerar caixa em diferentes ciclos econômicos e distribuir proventos sem comprometer os investimentos necessários. O objetivo é construir renda no longo prazo."},{"titulo":"Pilar 6 · Valor e crescimento","texto":"Empresas com espaço para crescer, ganhar eficiência ou recuperar rentabilidade. O foco está em valorizar o capital, escolhendo negócios cujo potencial de retorno compense o preço pago e os riscos assumidos."},{"titulo":"Pilar 7 · Fundos listados","texto":"FIIs, Fiagro e FI-Infra dão acesso a imóveis e operações de crédito em diferentes setores. O objetivo é combinar renda, diversificação e potencial de valorização, com gestão especializada e atenção aos riscos de cada estrutura."}],"pilares_nota":"Os pilares não são exclusivos: empresas de dividendos podem crescer, companhias de crescimento também podem distribuir proventos, e os fundos listados combinam renda e potencial de valorização.","criterios":[{"titulo":"Papel na carteira","texto":"Identifica a contribuição específica de cada ativo: renda, qualidade, diversificação, recuperação ou crescimento."},{"titulo":"Reavaliação da posição","texto":"Perda persistente de competitividade, retorno sobre o capital abaixo do seu custo ou deterioração financeira podem justificar ajustes. Nos fundos, também observamos a qualidade dos ativos, do crédito e a sustentabilidade dos rendimentos."},{"titulo":"Risco inerente","texto":"Oscilações próprias do negócio não invalidam, por si só, a tese. O acompanhamento busca distinguir oscilação cíclica de deterioração estrutural."},{"titulo":"Preço justo e retorno esperado","texto":"Quando a cotação atinge ou supera o valor justo estimado, revisamos premissas e retorno esperado. Nos fundos, também consideramos a qualidade da carteira e a sustentabilidade dos rendimentos. Se o retorno deixar de compensar os riscos, podemos reduzir ou encerrar a posição, mesmo com fundamentos sólidos."}],"P5":{"titulo":"Alocação · Pilar de Dividendos","subtitulo":"Sete empresas em três grupos setoriais. Cada pilar soma 100% e é acompanhado separadamente.","secao":"COMO O PILAR ESTÁ DISTRIBUÍDO","caixas":[{"titulo":"Financeiro · 40%","texto":"Itaúsa, Bradesco e BB Seguridade combinam qualidade bancária, recuperação e seguros."},{"titulo":"Setor elétrico · 30%","texto":"Copel e AXIA reúnem infraestrutura essencial, receitas reguladas e geração de energia."},{"titulo":"Commodities · 30%","texto":"Petrobras e Klabin acrescentam exposição ao dólar e a mercados internacionais."}],"nota":"","fontes":"Fontes: composição da carteira em 30/10/2026; elaboração própria."},"P6":{"titulo":"Alocação · Valor e Crescimento","subtitulo":"Seis empresas em seis setores. Os pesos diferenciam a exposição ao crescimento, aos juros e à execução.","secao":"O QUE EXPLICA A DIVERSIFICAÇÃO","caixas":[{"titulo":"Juros e atividade","texto":"Equatorial, Allos, Vamos e Inter são sensíveis, em graus distintos, ao custo do capital e à economia."},{"titulo":"Petróleo e agro","texto":"PRIO e 3tentos ampliam a exposição a cadeias produtivas diferentes das empresas domésticas."},{"titulo":"Peso e execução","texto":"Inter e 3tentos têm pesos de 10% por dependerem mais do crédito e da maturação industrial."}],"nota":"Negócios dos mesmos setores podem cumprir papéis distintos: Petrobras prioriza renda; PRIO, expansão. Nas elétricas, Copel e AXIA combinam renda e infraestrutura; Equatorial prioriza crescimento.","fontes":"Fontes: composição da carteira em 30/10/2026; elaboração própria."},"P7":{"titulo":"Alocação · Fundos Listados","subtitulo":"Oito fundos em seis segmentos: 47,5% em tijolo, 30% em crédito e multiestratégia e 22,5% em infraestrutura. Cada pilar soma 100% e é acompanhado separadamente.","secao":"","caixas":[],"nota":"","fontes":"Fontes: composição da carteira em 30/10/2026; elaboração própria. Classificação pela estratégia principal de cada fundo."},"P7_intro":{"titulo":"Fundos listados na carteira","texto":"O Pilar 7 reúne fundos de tijolo, crédito imobiliário, agronegócio e infraestrutura. Buscamos combinar renda recorrente, diversificação e valorização patrimonial, selecionando ativos de qualidade com gestão especializada, retorno esperado atrativo e disciplina de preço.","secoes":[{"titulo":"O PAPEL DOS DOIS BLOCOS","caixas":[{"titulo":"Tijolo · Imóveis e aluguéis","texto":"Fundos que investem em galpões logísticos, shoppings e imóveis comerciais. Os aluguéis sustentam a renda recorrente, enquanto reajustes contratuais, melhorias operacionais e vendas de ativos podem gerar valorização. Ocupação, qualidade dos locatários e endividamento são fundamentais."},{"titulo":"Crédito · Papel e infraestrutura","texto":"Fundos que investem em CRIs, CRAs e debêntures incentivadas. O retorno combina juros, atualização monetária e eventuais ganhos de capital. Avaliamos a qualidade dos devedores, as garantias, a concentração da carteira e a exposição aos juros e à inflação."}],"nota":"Renda elevada não significa, necessariamente, melhor investimento. Vacância, inadimplência, juros e alavancagem afetam o retorno. Diversificar reduz riscos específicos, mas não elimina perdas."},{"titulo":"POR QUE FUNDOS LISTADOS NA CARTEIRA","caixas":[{"titulo":"Acesso e diversificação","texto":"As cotas permitem participar de carteiras de imóveis e crédito de diferentes setores, regiões e devedores, com menor necessidade de capital do que a compra direta de grandes ativos."},{"titulo":"Renda e eficiência tributária","texto":"Buscamos distribuições sustentadas pelo resultado recorrente. Para pessoas físicas, os rendimentos podem ser isentos conforme a legislação. Ganhos na venda de FIIs e Fiagros são tributados em 20%; nos FI-Infra elegíveis, a alíquota é zero."},{"titulo":"Gestão especializada","texto":"Equipes selecionam ativos, acompanham locatários e devedores, negociam contratos e reciclam capital. A qualidade das decisões e a disciplina no preço de aquisição são determinantes para o retorno."},{"titulo":"Liquidez e retorno esperado","texto":"As cotas são negociadas em Bolsa, com liquidação em D+2, mas a liquidez varia. Avaliamos preço de entrada, qualidade dos ativos, rendimentos sustentáveis e potencial de valorização, não apenas dividend yield ou P/VP."}],"nota":""}],"fontes":"Fontes: B3; CVM; Lei 8.668/1993 (FII); Lei 11.033/2004, art. 3º (isenção de rendimentos para pessoa física); Lei 12.431/2011 (FI-Infra); Receita Federal."}},"equivalencias":{"BBDC3":{"tese":"BBDC4","nota":"A tese de 30/10 foi escrita para BBDC4; as carteiras decididas no simulador usam BBDC3 (Para estudar, e16)."}},"sem_tese":{"KNHF11":"O documento de 30/10 traz MCRE11 e KNSC11 no lugar de KNHF11 e HGCR11 (Para estudar, e15).","HGCR11":"O documento de 30/10 traz MCRE11 e KNSC11 no lugar de KNHF11 e HGCR11 (Para estudar, e15)."}},"cenario":[{"indicador":"Selic","valor":0.1375,"tipo":"nível","data":"04/11/2026","leitura":"Mantida por unanimidade. Interrompe 5 cortes de 0,25 p.p. desde 15%. Próximo Copom: 8 e 9/12.","ordem":1},{"indicador":"IPCA 2026 (Focus)","valor":0.0522,"tipo":"projeção","data":"03/11/2026","leitura":"2027: 4,76% · 2028: 4,00%.","ordem":2},{"indicador":"Dólar em outubro","valor":0.046,"tipo":"variação","data":"31/10/2026","leitura":"PTAX R$ 5,18 → R$ 5,42 · R$ 5,48 em 04/11. Focus vê R$ 5,34 no fim do ano.","ordem":3},{"indicador":"Ibovespa em outubro","valor":-0.0988,"tipo":"variação","data":"31/10/2026","leitura":"186.340 → 167.922.","ordem":4},{"indicador":"Juro real longo (IPCA+ 2035)","valor":0.0788,"tipo":"nível","data":"05/11/2026","leitura":"Tesouro IPCA+ 2035. Prefixado 2032 a 15,38% (não reconferido).","ordem":5},{"indicador":"IDIV em outubro","valor":-0.0987,"tipo":"variação","data":"31/10/2026","leitura":"Não reconferido no deck.","ordem":6},{"indicador":"IFIX em outubro","valor":-0.0289,"tipo":"variação","data":"31/10/2026","leitura":"Não reconferido no deck.","ordem":7},{"indicador":"Treasury 10 anos","valor":0.0484,"tipo":"nível","data":"05/11/2026","leitura":"Rendimento nominal, Tesouro dos EUA.","ordem":8},{"indicador":"Selic no fim de 2026 (Focus)","valor":0.135,"tipo":"projeção","data":"03/11/2026","leitura":"Fim de 2027: 12,50%.","ordem":9},{"indicador":"PIB 2026 (Focus)","valor":0.0176,"tipo":"projeção","data":"03/11/2026","leitura":"Crescimento esperado para 2026.","ordem":10}],"pares":[{"par":"VWRA × VHVE","a":"VWRA","b":"VHVE","pilar":"P12 e P11","correlacao":1.0,"leitura":"“praticamente o mesmo ativo”"},{"par":"IHYA × SDHA","a":"IHYA","b":"SDHA","pilar":"P10","correlacao":0.99,"leitura":"“praticamente o mesmo ativo”"},{"par":"EMCA × JPEA","a":"EMCA","b":"JPEA","pilar":"P10","correlacao":0.97,"leitura":"“praticamente o mesmo ativo”"},{"par":"EIMI × VFEA","a":"EIMI","b":"VFEA","pilar":"P12","correlacao":0.93,"leitura":"dois ETFs de emergentes"}],"falas":[{"id":"f1","autor":"Consultor A · resposta única deste consultor","bloco":"Renda fixa","slide":48,"texto":"O que você mudaria nas carteiras-modelo hoje?\nComo temos um peso grande em pós-fixados, acho importante possuirmos fundos pós-fixados aprovados pelo comitê para alocação.\nQuais ativos entrariam ou sairiam?\nPoderia ter uma curadoria de FIDCs aprovados. O fato de não ter volatilidade na marcação gera uma tranquilidade psicológica grande para investidores mais conservadores."},{"id":"f2","autor":"Consultor B · resposta única deste consultor","bloco":"Alternativos","slide":48,"texto":"O que você mudaria nas carteiras-modelo hoje?\nSinto falta principalmente de uma forma mais fácil e próxima de acompanharmos as carteiras e recomendações, e também as performances das carteiras base todos fechamentos de mês. Acredito que o próprio comitê resolverá ou melhorará muito estes dois problemas que temos hoje.\nQuais ativos entrariam ou sairiam?\nSinto falta de algum ativo como Ouro para Hedge das carteiras, inclusive acredito que tendo duas opções para 'alternativos', como ouro e real estate, faz com que os clientes tenham 2 opções de diversificação alternativa e hedge na carteira, fará com que cada um escolha o que prefere, e se quiser os dois, mas desta forma não abre margem para parecer 'oferta' de produtos.\nE acredito que para os clientes mais moderado-conservadores um olhar em RV Brasil para etfs e não diretamente as ações.\nSeria ideal também termos recomendações da OREGON de ativos de RF bancária para os clientes muito conservadores, para termos um direcionamento geral dos clientes para ativos ou bancos específicos, assim teremos uma unidade entre as carteiras dos clientes, e evitamos bancos 'pequenos', eventos como banco master ficariam mitigados dentro da nossa base de clientes."},{"id":"f3","autor":"Consultor C · resposta 1 de 3 deste consultor","bloco":"Renda fixa","slide":49,"texto":"O que você mudaria nas carteiras-modelo hoje?\nAcredito que poderiamos ter um racional maior dentro do pós fixado, um racional onde mostre a não ser um backtest mas algo que comprove que estamos na estratégia certa de alocação.\nNesta linha de pós fixado, a geração de alfa a cima do CDI é importante, pois hoje todo nosso pós não consegue gerar e movimento contrário do mercado sofremos muito, acredito que ter alguma outra tese em pós seria bem importante para o cliente ver valor nisso também, na consultoria querendo ou não acaba que o cliente hoje tem muito mais ciencia de alocação então precisa ver valor nessa construção e segurança. Como por exemplo ativos bancários, utilizar como pré fixado em algumas oportunidades seria bem importante.\nTambém entrar na linha de fidcs, ver alguns ativos que poderiamos alocar, que confiamos no gestor e etc. Acho importante termos produtos que nao alocamos de jeito algum e outros que temos flexibilidade como esse, colocar 3% do pós.\nQuais ativos entrariam ou sairiam?\nFIDCS, CDBs, diminuir exposição em pós que tem oscilação."},{"id":"f4","autor":"Consultor C · resposta 2 de 3 deste consultor","bloco":"Alternativos","slide":49,"texto":"O que você mudaria nas carteiras-modelo hoje?\nAtivos descorrelacionados para parte de alternativo, que criam uma tese totalmente diferente, mas sempre pra perfis muito mais agressivos.\nQuais ativos entrariam ou sairiam?\nCIBR, SOXX.. Bitcoin..\nConsultor C · resposta 3 de 3 deste consultor\nO que você mudaria nas carteiras-modelo hoje?\nCriaria uma flexibilidade em FIIs, nao vejo sentido em carteiras de crescimento, são ativos que não performam a muito tempo. Outro ponto caso queira utilizar é entender um % muito mais tranquilo ou flexivel.\nAumento da alocação em pré fixado, racional de aproveitar os juros mais altos.\nTer um racional e ESTRATÉGIA dentro do stock picking que fazemos. dentro de brasil e EUA, temos vários clientes que utilizam parte de stocks e dentro da VG temos 4 ativos no máximo para alocar, os outros são reits e etc.. acredito que poderiamos ir mais a fundo e criar uma estratégia mais robusta para estes clientes, para aqueles que nao quer etf.\nOutro ponto é a diversificação da carteira, eu sempre explico sobre teoria de markowitz sobre alocação, acho importante institucionalizar, para nao deixarmos muitos ativos.\nUltimo ponto sobre estratégia BULL Bear sempre gostei de utilizar isso pois defende muito a carteira do cliente, onde usa o mesmo peso de bolsa para bolsa americana ou dólar.\nEssa relação nos ultimos anos sempre deu certo e é uma teoria facil e boa para bater em carteiras e mostrar que seguimos firmes a estratégia.\nQuais ativos entrariam ou sairiam?\nMescla de small / valor, dentro das ações, stocks e etc."},{"id":"f5","autor":"Consultor D · resposta única deste consultor","bloco":"Brasil","slide":50,"texto":"O que você mudaria nas carteiras-modelo hoje?\nFaria um ajuste em relação aos percentuais, aumentando a exposição percentual em offshore, aumentando a posição em CDI, entraria em pré-fixados com trava de tamanho de aporte mensal em uma relação % com o PL e taxa mínima para ser contratada de 14% a.a.\nNas ações, concentraria o portfolio em ativos do segmento industrial, materiais e necessariamente com boa parte da receita dolarizada e indexada a comodities, manteria algumas teses em Brasil, olhando principalmente para Utilities e Setor financeiro.\nEvitaria a continuidade de alocação em FIIs, entrando apenas em produtos com nível de desconto muito grande, para que ele sirva não necessariamente como um grande motor de geração de renda, mas principalmente uma tese de \"special sits\" ou para capturar uma grande reversão.\nCasos como CDII11 ou até mesmo o TRXF, que estão bem abaixo do valor dos respectivos patrimônios.\nNo portfolio Offshore que proponho aumentar o %, entendo interessante considerar a alocação em ativos como Value, Utilities (tem grande correlação com juros), BioTecnologia, em relação a teses mais \"temáticas\" basicamente com essa alocação parece funcionar.\nAcredito que a tese de emergentes que teve um bom Rally não deve ser acreditada com uma grande continuidade, o excepcionalismo americano deve perdurar, de toda forma, não acredito que manter uma alocação com um peso muito grande em tecnologia de maneira ampla é o melhor caminho, pensando nisso, minhas sugestões para essa parte é, concentrar o portfolio em alongar duration em Treasury, evitando a alocação em crédito, imaginando que o premio de risco global tende a aumentar, pensando nisso, ficar investido nos tematicos assinalados acima, manter a posição em VHVE e VWRA, pensando principalmente em dar manutenção para o portfolio."},{"id":"f6","autor":"Consultor D · continuação","bloco":"Brasil","slide":50,"texto":"Entendo que o carrego de algumas Big Techs tem um potencial transformacional para o portfolio, então ativos como TSLA e MSFT podem ser algumas das teses mais vencedoras, que vão conseguir dar passos largos de crescimento, pela robustez e mercado endereçavel das companhias.\nQuais ativos entrariam ou sairiam?\nSobre os ativos para sair ou entrar, precisaria validar o que sai, vou deixar assinalado alguns ativos que poderiam entrar:\nONSHORE: WEGE3 · EMBJ3 · AURE3 · 5PRE11\nOFFSHORE: IUUS · MSFT · TSLA · SBIO\nIBRX - Ativo que venho acompanhando que tem um potencial de ser bem transformacional, mas necessitaria uma analise mais aprofundada, se fosse entrar, seria como um private equity, que a gente quer comprar um pequeno valor e carregar por um longo período de tempo.\nSobre os %, vejo que temos uma oportunidade de aumentar o % Offshore dos portfolios. Estou finalizando uma tabela para enviar.\nTenho outras considerações e percepções que vejo dificil colocar nessa mensagem.\nUm grande abraço."},{"id":"f7","autor":"Consultor E · resposta única deste consultor","bloco":"Renda fixa","slide":51,"texto":"O que você mudaria nas carteiras-modelo hoje?\nTraria mais opções pós fixadas considerando que é a classe com maior percentual entre todas e temos apenas LFTB11 como alternativa hoje, que acabando servindo como \"caixa\". Adicionaria em percentual o alternativo brasil, se em caso de previdência como sucessão.\nQuais ativos entrariam ou sairiam?\nEntrariam: stocks EUA e REITS e talvez bancários como opção para renda fixa. Ouro\nNão tiraria nenhum ao menos que tenha mudança de tributação."},{"id":"f8","autor":"Consultor F · resposta única deste consultor","bloco":"Internacional","slide":51,"texto":"O que você mudaria nas carteiras-modelo hoje?\nPontos da carteira internacional:\n1. VWRA e VHVE são praticamente o mesmo ativo, com 1 de correlação.\n2. IHDA e SDHA são praticamente o mesmo ativo, com 0,99 de correlação, somando 60% do Pilar 10.\n3. EMCA e JPEA são praticamente o mesmo ativo, com 0,97 de correlação, somando 40% do Pilar 10.\n4. Micron representa 1,97% da carteira. IUVL representa 20% do Pilar 11 e tem 19,6% em Micron.\n5. TSMC representa 1,95% da carteira com EIMI e VFEA.\n6. EIMI e VFEA tem correlação de 0,93% somando 80% do Pilar 12.\n7. Pilares 10, 11 e 12 possuem entre si correlação superior à 0,80.\n8. Inexistência de diversificação de duration para renda fixa.\n9. Inexistência de alocação em metais e commodities.\nPontos da carteira nacional:\n1. Inexistência de FIDC no Pilar 3.\n2. Inexistência de ETFs de renda variável.\n3. Limitação de recomendação de fundos de previdência fora do Pilar 3.\nQuais ativos entrariam ou sairiam?\nRefletiria sobre a validada da entrada em\nIAU, GDX, SLV, SIL, CPER, COPX, RSP, IEF."}],"textos":[{"id":"t1","titulo":"Resposta sobre ETF · ETF ou carteira própria","texto":"A carteira própria de dividendos também possui uma vantagem importante de eficiência tributária.\n\nNos ETFs distribuidores, como DIVD11 e NDIV11, o investidor paga 15% de imposto sobre os rendimentos antes mesmo de receber o dinheiro. Já na carteira própria, os dividendos continuam, em regra, isentos.\n\nO DIVO11, que é acumulador, tem a vantagem de reinvestir automaticamente os dividendos e postergar o imposto. Mas, se o cliente precisar transformar esse patrimônio em renda, terá que vender cotas, pagando 15% sobre o ganho realizado, inclusive sobre a valorização decorrente dos dividendos reinvestidos.\n\nNa carteira própria, conseguimos receber e reinvestir os dividendos sem essa tributação, além de selecionar empresas pela qualidade dos fundamentos, crescimento dos lucros e sustentabilidade dos proventos.\n\nA ressalva é a nova tributação de altas rendas, especialmente para quem recebe mais de R$ 50 mil mensais em dividendos de uma única empresa ou possui rendimentos anuais superiores a R$ 600 mil.\n\nPortanto, a carteira própria pode combinar maior eficiência tributária, geração direta de renda e uma gestão mais criteriosa dos ativos. O objetivo é maximizar o retorno líquido que fica com o investidor no longo prazo.","bloco":"Brasil"},{"id":"t2","titulo":"Resposta · carteira Brasil, dólar, WEG e Embraer","texto":"Minha visão é que a carteira brasileira deve representar uma exposição estratégica ao Brasil dentro do patrimônio global do cliente, especialmente aos setores em que encontramos empresas competitivas, rentáveis e com capacidade de gerar valor.\n\nNão significa investir exclusivamente na economia doméstica. Já temos Klabin, Petrobras, PRIO e 3tentos, que oferecem exposição a commodities, dólar e cadeias produtivas internacionais.\n\nO que eu questiono é transformar essa exposição internacional em uma prioridade adicional da carteira Brasil, quando o cliente já possui um portfólio no exterior.\n\nAcho válido estudar Embraer e WEG, mas pela qualidade das teses, pelo valuation e pelo retorno esperado, não simplesmente para aumentar a participação de empresas industriais e dolarizadas.\n\nNosso diferencial é justamente selecionar boas empresas brasileiras, principalmente em setores como financeiro, energia e infraestrutura, preservando uma exposição relevante ao Brasil como parte da alocação global.","bloco":"Brasil"},{"id":"t3","titulo":"3tentos (TTEN3) | O que aconteceu no 2T26?","texto":"→ Tempestade perfeita: deterioração das margens industriais, principalmente no esmagamento de soja e no biodiesel. Preços mais fracos do farelo e do biodiesel comprimiram os spreads e pressionaram o EBITDA.\n\n→ Biodiesel: o mercado esperava a elevação da mistura obrigatória de B15 para B16 em 2026, mas houve postergação para 2027. Com maior capacidade instalada e demanda abaixo do esperado, as margens ficaram pressionadas. Existe a possibilidade de avanço direto para B17 em 2027, ainda sem confirmação regulatória.\n\n→ Estoques: historicamente, a 3tentos aumenta os estoques de soja no primeiro semestre, aproveitando a safra. Depois, comercializa ou processa esses grãos, liberando capital de giro no segundo semestre. Em 2026, os estoques passaram de R$ 2,16 bilhões para R$ 4,22 bilhões.\n\n→ Investimentos: justamente nesse período de maior necessidade de capital de giro, a companhia também investiu pesado na ampliação das indústrias de soja, biodiesel e etanol.\n\n→ Etanol de milho: a nova planta em Mato Grosso começou a operar apenas em junho, ainda sem contribuição relevante para o EBITDA do 2T26. Quando madura, tem potencial estimado de gerar R$ 200 milhões a R$ 250 milhões de EBITDA anual.\n\n→ Consequência: dívida líquida subiu de R$ 1,6 bilhão para R$ 3,58 bilhões, enquanto o EBITDA ficou pressionado. A alavancagem aumentou e a empresa precisou negociar preventivamente um waiver com os credores.\n\n→ Nossa leitura: o problema foi o descasamento entre dívida, investimentos e geração de resultado. Parte relevante dessa pressão é conjuntural, não necessariamente estrutural. A recuperação depende da liberação dos estoques, da maturação do etanol e da normalização das margens industriais, com efetiva conversão em caixa e desalavancagem.","bloco":"Brasil"},{"id":"t4","titulo":"Resposta · FII é ativo de crescimento?","texto":"Os fundos imobiliários fazem sentido como instrumentos de renda e diversificação, mas temos que ter cuidado ao classificá-los como ativos de crescimento.\n\nComo são obrigados a distribuir pelo menos 95% do resultado em caixa, possuem uma capacidade muito limitada de financiar o próprio crescimento com lucros retidos. Para expandir, acabam dependendo mais de emissões, endividamento e reciclagem de ativos.\n\nO TRXF11 é um bom exemplo de gestão ativa e expansão agressiva, mas precisamos separar crescimento do patrimônio total do fundo de crescimento efetivo do resultado por cota.\n\nPara um investidor que busca crescimento patrimonial de longo prazo, vejo mais potencial estrutural nas empresas que conseguem reinvestir seus lucros com retornos elevados. Os FIIs podem continuar na carteira, mas com um papel mais complementar, voltado à renda, diversificação e valorização dos ativos imobiliários.","bloco":"Brasil"},{"id":"t5","titulo":"Contribuição · recompras, IA e o mundo depois da pandemia","texto":"Existe uma mudança relevante acontecendo nas empresas americanas. Durante muitos anos, as big techs geravam muito caixa e recompravam ações, impulsionando o lucro por ação. Agora, com os investimentos massivos em inteligência artificial, algumas praticamente interromperam as recompras e passaram até a emitir ações e dívida para financiar a expansão.\n\nIsso muda a dinâmica de retorno. Antes, além do crescimento operacional, tínhamos o benefício da redução do número de ações. Agora, o investidor precisa confiar que todo esse capex vai gerar retornos suficientes para compensar o investimento e uma eventual diluição.\n\nNão significa que o S&P 500 deixará de subir, mas é mais um argumento para questionar se a próxima década oferecerá os mesmos retornos extraordinários da anterior.\n\nO mundo mudou depois da pandemia. Saímos de um ambiente de inflação baixa, juros próximos de zero e globalização desinflacionária para outro com gastos públicos elevados, riscos fiscais crescentes e maior fragmentação geopolítica.\n\nNesse ambiente, a renda fixa voltou a oferecer retornos interessantes, enquanto as ações americanas continuam negociando com expectativas elevadas de crescimento, principalmente em inteligência artificial.\n\nIsso é uma mudança relevante em relação aos últimos 15 anos, quando as recompras foram um importante mecanismo de crescimento do lucro por ação e de remuneração dos acionistas.. essa era de recompras massivas (buybacks) despencou drasticamente em 2026. As gigantes da tecnologia congelaram ou reduziram suas recompras para desviar centenas de bilhões de dólares para investimentos em infraestrutura de Inteligência Artificial (IA).\n\nIsso não significa necessariamente que a bolsa americana vá cair, mas significa que o prêmio por assumir risco acionário pode ser menor. É justamente esse o argumento por trás da Vanguard defender 40% em ações e 60% em renda fixa.\n\nO cuidado é que os próprios títulos públicos também estão expostos a riscos fiscais e inflacionários. Por isso, a discussão mais ampla é sobre como construir uma carteira verdadeiramente diversificada para um regime econômico diferente daquele que predominou na década passada.","bloco":"Internacional"}],"estudo":[{"id":"e1","tipo":"Erro no simulador","bloco":"Renda fixa","prioridade":"Alta","titulo":"Pilar 2 passa de 100% em 7 carteiras","detalhe":"O IRFM11 ficou com 100% dentro do Pilar 2 (é o padrão da aba Lista) e o 5PRE11 (30%) e o IDKA11 (30%) entraram sem reduzir o IRFM11. Só o Crescimento Conservador foi ajustado (50/20/30). Por isso a soma dos ativos dessas carteiras passa de 100%.","acao":"Definir os pesos internos do P2 somando 100% (o 50/20/30 do Conservador é um caminho) e replicar nas outras carteiras.","ordem":1},{"id":"e2","tipo":"Erro no simulador","bloco":"Internacional","prioridade":"Alta","titulo":"Internacional passa de 100% nos pilares","detalhe":"O P13 Alternativo entrou nas três carteiras Internacional sem reduzir os Pilares 9 a 12, e a aba Ativos não tem ativo de P13 nessas carteiras.","acao":"Decidir se o P13 entra no Internacional. Se entrar, cortar de P9 a P12 e definir os ativos.","ordem":2},{"id":"e3","tipo":"Erro no simulador","bloco":"Brasil","prioridade":"Alta","titulo":"Renda Defensivo com metade em renda variável","detalhe":"A coluna J virou “Defensivo”, mas os pesos são os do antigo Renda Super Arrojado (P5 30% e P7 20%). No Crescimento, a coluna F foi convertida de verdade para defensivo (P3 50%, sem ações).","acao":"Confirmar se o Renda Defensivo deve seguir o Crescimento Defensivo ou se o rótulo está errado.","ordem":3},{"id":"e4","tipo":"Erro no simulador","bloco":"Renda fixa","prioridade":"Alta","titulo":"Pilar 3 está com ativos de teste","detalhe":"Os 12 slots do P3 (Franchini FIDC 1 a 8 e Fundo pós CP Franchini 1 a 4) estão marcados na aba Lista como “Exemplo de teste, não é recomendação real”. A base 30/10 usava LFIN11, GICP11 e DEBB11, que ficaram fora da recomendação até o esclarecimento tributário dos ETFs.","acao":"Não apresentar o P3 como carteira real até o Comitê aprovar os produtos (ligado à Votação 6).","ordem":4},{"id":"e5","tipo":"Erro no simulador","bloco":"Alternativos","prioridade":"Média","titulo":"Alternativo Super Arrojado passa de 100%","detalhe":"A coluna está marcada “Super Arrojado - CANCELAR”: CYPRESS 100% + IBIT 50% + DTLA 20% dentro do P13.","acao":"Confirmar o cancelamento e tirar a carteira do material.","ordem":5},{"id":"e6","tipo":"Erro no simulador","bloco":"Brasil","prioridade":"Média","titulo":"INBR32 → INBR34","detalhe":"O INBR32 foi encerrado em 16/10/2026 e o INBR34 negocia desde 19/10 (Caderno). As teses já usam INBR34; o simulador ainda usa INBR32.","acao":"Trocar o ticker nas abas Lista e Ativos.","ordem":6},{"id":"e7","tipo":"Erro no simulador","bloco":"Internacional","prioridade":"Média","titulo":"Base 30/10: Internacional Conservador fecha em 95,5%","detalhe":"Na base, o P11 Conservador soma 85% por dentro (VTI 45 + VXUS 20 + VTV 20). No decidido, o P11 passou a somar 100%.","acao":"Registrar a correção na ata.","ordem":7},{"id":"e8","tipo":"Conferir","bloco":"Internacional","prioridade":"Média","titulo":"VWRA (VT) dentro do Pilar 12 Emergentes/Ásia","detalhe":"O VWRA é um ETF do mundo todo (par VT) e ocupa 20% do pilar de emergentes.","acao":"Conferir o enquadramento com o Research Internacional.","ordem":8},{"id":"e9","tipo":"Conferir","bloco":"Internacional","prioridade":"Baixa","titulo":"Par US do VHVE","detalhe":"O simulador usa “VHVE (VTI)”. O Consultor F trata VHVE e VWRA como praticamente o mesmo ativo (correlação de 1).","acao":"Conferir qual é o par equivalente e se os dois precisam ficar.","ordem":9},{"id":"e10","tipo":"Conferir","bloco":"Alternativos","prioridade":"Média","titulo":"DTLA (TLT) em dois pilares","detalhe":"O TLT está no P9 (20% do pilar) e também no P13 Alternativo (30% no Moderado e 20% no Arrojado).","acao":"É a Votação 4. Não aumentar sem critério de saída.","ordem":10},{"id":"e11","tipo":"Conferir","bloco":"Brasil","prioridade":"Média","titulo":"VAMO3: potencial de +509% até o preço justo","detalhe":"A cotação de R$ 2,38 bate com o P/L de ~5x, mas o potencial vai chamar atenção. A própria tese prevê revisão para baixo se os juros ficarem altos.","acao":"Se perguntarem, dizer que o preço justo depende do juro.","ordem":11},{"id":"e12","tipo":"Conferir","bloco":"Brasil","prioridade":"Média","titulo":"3tentos: qual alavancagem citar","detalhe":"As teses usam 3,05x ajustada (jun/26); o Caderno cita 6,56x e o waiver do 2T26.","acao":"Confirmar o conceito (ajustada ou cheia, sobre qual EBITDA). Sem tempo, falar da dívida líquida em reais: R$ 1,6 bi para R$ 3,58 bi.","ordem":12},{"id":"e13","tipo":"Conferir","bloco":"Brasil","prioridade":"Baixa","titulo":"XPML11: retorno do deck é só preço","detalhe":"O deck mostra −10,4% no ano só de preço. O Status Invest dá −3,57% em 12 meses.","acao":"Conferir antes de citar.","ordem":13},{"id":"e14","tipo":"Conferir","bloco":"Brasil","prioridade":"Baixa","titulo":"IDIV e IFIX de outubro","detalhe":"O deck marca −9,87% (IDIV) e −2,89% (IFIX) como não reconferidos.","acao":"Conferir antes de citar.","ordem":14},{"id":"e15","tipo":"Conferir","bloco":"Brasil","prioridade":"Média","titulo":"KNHF11 e HGCR11 no lugar de MCRE11 e KNSC11","detalhe":"Houve inversão entre principal e alternativo no P7. As teses de 30/10 ainda usam MCRE11 e KNSC11. O KNHF11 é híbrido (Kinea Hedge Fund), não papel puro.","acao":"Trazer o racional da troca ou voltar à tese.","ordem":15},{"id":"e16","tipo":"Conferir","bloco":"Brasil","prioridade":"Baixa","titulo":"BBDC3 x BBDC4","detalhe":"Resolvido nas teses de 04/11 (BBDC3). A BBDC4 paga 10% mais por ação; com desconto da ON acima de 9,09%, a BBDC3 passa a ter DY maior. Hoje o desconto está perto de 8%.","acao":"Confirmar o desconto no fechamento.","ordem":16},{"id":"e17","tipo":"Votação","bloco":"Geral","prioridade":"Alta","titulo":"1 · Bandas: Centro A (planilha 30/10) ou B (Corredores)?","detalhe":"Com aporte de 1% ao mês, nenhuma regra precisou vender no backtest: imposto zero. No Super Arrojado, ±25% teve 2 rebalanceamentos e 10,1 bp de imposto contra 3 e 19,6 bp no ±20%.","acao":"Regra que prefira aporte a venda (os Corredores ±25% já dizem isso). Centro A até os alvos dos Corredores serem confirmados.","ordem":17},{"id":"e18","tipo":"Votação","bloco":"Brasil","prioridade":"Alta","titulo":"2 · Pesos Brasil: um voto por pilar (1 a 7)","detalhe":"Pilares 1 a 4 são do Estrategista. Pilar 3 está sem produto operável para novas aplicações em uma das plataformas (dúvida de IR dos ETFs). No P6, o Caderno traz três modelos (A, B e C).","acao":"P5: mantém. P6: mantém, tático, sem aumentar (modelo B ou C). P7: mantém, com papel complementar nos Crescimento.","ordem":18},{"id":"e19","tipo":"Votação","bloco":"Internacional","prioridade":"Alta","titulo":"3 · Offshore: mantém P9 a P12? Inverte o Moderado de 60/40 para 40/60?","detalhe":"Proposta da Presidência “para discussão”. Em 2022 ações e títulos caíram juntos. O Pilar 11 Conservador somava 85% por dentro na base.","acao":"Ouvir o Research Internacional. Do lado Brasil: dólar alto ajuda em reais, e o Estrategista diz “manter como proteção”.","ordem":19},{"id":"e20","tipo":"Votação","bloco":"Internacional","prioridade":"Média","titulo":"4 · TLT: só no P9, também no alternativo ou muda o peso?","detalhe":"Research Internacional: o TLT só protege quando o estresse é de crescimento, não de inflação. O critério de saída ainda está em definição.","acao":"Não aumentar sem critério de saída definido.","ordem":20},{"id":"e21","tipo":"Votação","bloco":"Alternativos","prioridade":"Média","titulo":"5 · Alternativos: abre o bloco? Quais ativos e perfis?","detalhe":"4 de 6 consultores pedem proteção (ouro). O P8 Brasil e o bloco estão em 0%. Para REITs, o Caderno pergunta se não duplicaria o risco imobiliário e de juros que o P7 já carrega.","acao":"P8 segue em 0. REIT só se não duplicar o P7.","ordem":21},{"id":"e22","tipo":"Votação","bloco":"Renda fixa","prioridade":"Média","titulo":"6 · Crédito e FIDC: abre? Limite, pilar e curadoria?","detalhe":"Estrategista: “evitar agora”. Presidência: “abrir com muita parcimônia”. Consultor C: 3% do pós. O P7 já tem FI-Infra (JURO11 e CDII11), que é crédito privado isento com cota em bolsa.","acao":"Se abrir: limite pequeno, curadoria e critério de marcação e liquidez antes. Cota que oscila pouco não é cota sem risco.","ordem":22},{"id":"e23","tipo":"Estudar","bloco":"Brasil","prioridade":"Alta","titulo":"WEGE3 e EMBJ3 para o catálogo do P6","detalhe":"Pedido do Consultor D (industrial, materiais, receita dolarizada). Nenhum ativo entra sem dizer o que sai. Auren fica no radar de elétricas, comparada a Copel e Axia.","acao":"Trazer no próximo Comitê: tese, preço teto, tamanho e condição de saída.","ordem":23},{"id":"e24","tipo":"Estudar","bloco":"Brasil","prioridade":"Média","titulo":"ETF de dividendos x carteira própria","detalhe":"Sobreposição: o IDIV, que o DIVO11 replica, já é concentrado em bancos e elétricas; ETFs de utilidade pública e de bancos compram de novo as mesmas empresas. Nos ETFs distribuidores o IR de 15% sai antes de o cliente receber.","acao":"Sua resposta está em “Seus textos”, abaixo.","ordem":24},{"id":"e25","tipo":"Estudar","bloco":"Internacional","prioridade":"Média","titulo":"Correlação alta entre os Pilares 10, 11 e 12","detalhe":"Consultor F: correlação acima de 0,80 entre os três pilares, sem diversificação de duration na renda fixa e sem metais e commodities. Ele sugere avaliar IAU, GDX, SLV, SIL, CPER, COPX, RSP e IEF.","acao":"Levar para a conversa da Votação 3 e 5.","ordem":25}],"etfs":{"LFTB11":{"nome_completo":"Investo ETF MarketVector Brazil Treasury 760 Day Target Duration Classe de Índice - Responsabilidade Limitada","gestora":"Investo Gestão de Recursos Ltda. (CNPJ 37.788.647/0001-30)","administrador":"Banco BNP Paribas Brasil S.A. (CNPJ 01.522.368/0001-82), também custodiante","cnpj":"56.176.507/0001-55","isin":"BRLFTBCTF002","ticker_bolsa":"LFTB11 · B3 · BRL","indice":"MarketVector Brazil Treasury 760 Day Target Duration Index (MVLFTB)","indice_metodologia":"Inclui todas as LFTs (Tesouro Selic) elegíveis e a NTN-B (Tesouro IPCA+) de vencimento mais longo. O peso da NTN-B é 760 dividido pelo prazo médio de repactuação (PMR) dela; o restante vai para as LFTs, proporcional ao valor de mercado. Entrada exige 12 meses ao vencimento (permanência, 6 meses). Rebalanceamento mensal, no último dia útil. O alvo de 760 dias é de PMR (critério tributário), não de duration econômica.","objetivo":"Acompanhar um índice que é quase todo Tesouro Selic, com uma pequena posição em Tesouro IPCA+ longo para manter o prazo médio de repactuação da carteira acima de 720 dias.","taxa_adm":"0,19% a.a. (taxa global)","classe_distribuicao":"acumula","distribuicao_texto":"Não distribui rendimentos: juros e cupons são reinvestidos. O regulamento permite amortização trimestral, a critério do gestor, só se a classe superar o índice no trimestre.","tributacao":{"texto":"Segundo o gestor, IR de 15% retido na fonte sobre o ganho, em qualquer prazo, sem come-cotas e sem IOF. O material do gestor explica que a carteira tem PMR acima de 720 dias, o que a coloca na faixa de 15% da regra de ETFs de renda fixa (Lei 13.043/2014).","fonte":"https://investoetf.com/lftb11/"},"patrimonio":{"valor":"R$ 6.939.770.956,21","data":"2026-11-05"},"duration":{"valor":"1,18 (duration modificada média do índice, conforme a MarketVector); PMR da carteira: 772 dias","data":"2026-11-07 (página do índice e página do gestor)"},"fatores":["Selic (pós-fixado)","juro real (IPCA+) longo via NTN-B","risco soberano"],"riscos":["A cota pode se descolar do índice por causa de taxas, custos de rebalanceamento e caixa.","A perna em NTN-B longa oscila com o juro real e pode fazer o fundo render abaixo do CDI em períodos de alta de juros.","As cotas e os títulos podem ter pouca liquidez no mercado secundário.","Se o provedor deixar de manter o índice, a classe pode ser liquidada.","Há possibilidade de perda de capital e de patrimônio líquido negativo; não há garantia do FGC."],"semelhantes":[{"ticker":"Tesouro Selic (direto)","diferenca":"LFT comprada diretamente: sem taxa de gestão e sem a perna de IPCA+ longo, mas o IR segue a tabela regressiva pelo prazo da aplicação."},{"ticker":"LFIN11","diferenca":"Também pós-fixado (DI), mas troca o risco soberano por risco de crédito de bancos (Letras Financeiras)."}],"papel_na_carteira":"Funciona como caixa de longo prazo em títulos soberanos pós-fixados, aceitando um pouco de volatilidade de juro real em troca da alíquota de 15% de IR.","busca_noticias":"\"Tesouro Selic\" OR \"taxa Selic\" OR \"Copom\" OR \"LFT\"","documentos":[{"titulo":"Página do ETF (Investo)","url":"https://investoetf.com/lftb11/"},{"titulo":"Lâmina do fundo (Investo)","url":"https://api.mziq.com/mzfilemanager/v2/d/02c0bf8f-2988-419f-9a6f-4e116a4bf822/317b07d7-aa6e-3c69-a81f-3df015141a49?origin=2"},{"titulo":"Material publicitário (Investo)","url":"https://api.mziq.com/mzfilemanager/v2/d/02c0bf8f-2988-419f-9a6f-4e116a4bf822/d3670dbd-89e1-ce56-a9ca-4bb4a6693f83?origin=2"},{"titulo":"Regulamento (versão de 16/03/2026, FundosNet B3)","url":"https://fnet.bmfbovespa.com.br/fnet/publico/downloadDocumento?id=1147544"},{"titulo":"Metodologia do índice MVLFTB (Index Guide v1.02, jan/2026)","url":"https://files.marketvector.com/index-guide/MVLFTB_Index_Guide.pdf"},{"titulo":"Página do índice (MarketVector)","url":"https://www.marketvector.com/indexes/bond/marketvector-brazil-treasury-760-day-target-duration"},{"titulo":"Informe diário CVM de 05/11/2026 (FundosNet B3)","url":"https://fnet.bmfbovespa.com.br/fnet/publico/exibirDocumento?id=1370897"}],"fontes":["https://investoetf.com/lftb11/","https://api.mziq.com/mzfilemanager/v2/d/02c0bf8f-2988-419f-9a6f-4e116a4bf822/317b07d7-aa6e-3c69-a81f-3df015141a49?origin=2","https://api.mziq.com/mzfilemanager/v2/d/02c0bf8f-2988-419f-9a6f-4e116a4bf822/d3670dbd-89e1-ce56-a9ca-4bb4a6693f83?origin=2","https://fnet.bmfbovespa.com.br/fnet/publico/downloadDocumento?id=1147544","https://files.marketvector.com/index-guide/MVLFTB_Index_Guide.pdf","https://www.marketvector.com/indexes/bond/marketvector-brazil-treasury-760-day-target-duration","https://fnet.bmfbovespa.com.br/fnet/publico/exibirDocumento?id=1370897","https://www.marketvector.com/insights/index-updates/rule-change-for-mvlftb","https://www.marketvector.com/insights/index-updates/marketvector-introduces-its-first-brazilian-fixed-income-index-licenses-to-investo-to-meet-rising-demand","https://fnet.bmfbovespa.com.br/fnet/publico/exibirDocumento?id=1143169","https://cvmweb.cvm.gov.br/SWB/Sistemas/SCW/CPublica/CConsolFdo/ResultBuscaParticFdo.aspx?CNPJNome=56176507000155"],"consultado_em":"2026-11-07","notas":"DISCREPÂNCIA PARCIAL: o rótulo 'ETF de Tesouro Selic' simplifica demais. O índice tem cerca de 90% em LFT e cerca de 9% na NTN-B 2060 (9,32% em 01/10/2026, página do gestor), usada para levar o PMR acima de 720 dias. Essa perna traz risco de juro real longo: em outubro/2026 o ETF rendeu 50,4% do CDI no mês (página do gestor, dados até 30/10/2026). Nome, ISIN e CNPJ informados pelo fornecedor de dados conferem com o regulamento e o cadastro da CVM; o gestor indica início em 31/10/2024. Além da taxa global, o regulamento prevê taxa máxima de custódia de 0,03% a.a. A duration modificada é a estatística corrente do índice na página da MarketVector (sem data explícita).","aviso_cadastro":"O cadastro do painel chama de \"ETF de Tesouro Selic\", e o índice não é só LFT: tem cerca de 90% em LFT e cerca de 9% na NTN-B 2060, usada para o prazo médio passar de 720 dias (alíquota de 15%). Essa perna traz risco de juro real longo. A premissa de sensibilidade do painel trata o LFTB11 como Selic pura (duration zero): confira antes de usar nos cenários."},"IRFM11":{"nome_completo":"It Now IRF-M P2 Fundo de Índice - Responsabilidade Limitada","gestora":"Itaú Asset Management (Itaú Unibanco Asset Management Ltda., CNPJ 40.430.971/0001-96)","administrador":"Itaú Unibanco S.A. (CNPJ 60.701.190/0001-04), também custodiante","cnpj":"32.880.642/0001-19","isin":"BRIRFMCTF009","ticker_bolsa":"IRFM11 · B3 · BRL","indice":"IRF-M P2 (ANBIMA)","indice_metodologia":"Subíndice da família IMA com títulos prefixados (LTN e NTN-F) ponderados pelo estoque em mercado. Se o prazo médio de repactuação (PMR) estimado ficar abaixo de 780 dias, a ANBIMA reduz os títulos mais curtos até atingi-lo, para que o PMR nunca caia abaixo de 720 dias. Rebalanceamento mensal (vigência do 2º dia útil do mês ao 1º dia útil do mês seguinte).","objetivo":"Dar acesso, numa só cota, a uma cesta de títulos públicos prefixados com prazo médio acima de dois anos, replicando o IRF-M P2.","taxa_adm":"0,20% a.a. (total máximo: administração 0,04% + gestão 0,13% + custódia 0,03%)","classe_distribuicao":"acumula","distribuicao_texto":"Os resultados são reinvestidos automaticamente na classe; os cupons das NTN-F não são pagos ao cotista.","tributacao":{"texto":"Segundo o gestor, IR de 15% sobre o ganho de capital em qualquer prazo, sem IOF e sem come-cotas. O regulamento explica que a alíquota varia de 25% a 15% conforme o prazo de repactuação da carteira (Lei 13.043/2014) e sobe para 30% se o fundo tiver menos de 75% em títulos do índice.","fonte":"https://www.itnow.com.br/irfm11/"},"patrimonio":{"valor":"R$ 1.036.700.784,90","data":"2026-11-05"},"duration":{"valor":"593 dias úteis (duration do índice IRF-M P2; PMR de 918 dias corridos)","data":"set/2026 (lâmina ANBIMA do índice)"},"fatores":["juro nominal prefixado","duration intermediária (cerca de 2,4 anos)","título público federal"],"riscos":["O preço dos prefixados cai quando sobem as expectativas de juros futuros.","A cota pode se descolar do índice por taxas, custos de rebalanceamento e caixa.","Não há garantia de mercado secundário ativo para as cotas; o preço em bolsa pode ter ágio ou deságio sobre o valor patrimonial.","Se a ANBIMA descontinuar o índice ou a licença não for renovada, o fundo pode mudar de objetivo ou ser liquidado.","Com menos de 75% da carteira em títulos do índice, a alíquota de IR passa a 30%."],"semelhantes":[{"ticker":"IDKA11","diferenca":"Mesma família IMA, mas com piso de PMR de 1.110 dias (cerca de 3 anos): carteira mais longa e mais sensível a juros."},{"ticker":"5PRE11","diferenca":"Índice Teva com os 7 prefixados mais longos e prazo médio alvo de 5 anos: o mais sensível a juros dos três."}],"papel_na_carteira":"É a exposição mais curta da carteira à curva prefixada, ganhando quando os juros futuros recuam e perdendo quando sobem.","busca_noticias":"\"IRF-M\" OR \"Tesouro Prefixado\" OR \"LTN\" OR \"juros futuros\" OR \"DI futuro\"","documentos":[{"titulo":"Página do ETF (It Now)","url":"https://www.itnow.com.br/irfm11/"},{"titulo":"Lâmina do fundo (30/10/2026)","url":"https://assetfront.arquivosparceiros.cloud.itau.com.br/FND/ITAUIRFMP24216_It_Now_IRF-M_P2.pdf"},{"titulo":"Regulamento (25/06/2025)","url":"https://assetfront.arquivosparceiros.cloud.itau.com.br/ITN/regulamento-IRFM.pdf"},{"titulo":"Fatores de risco","url":"https://assetfront.arquivosparceiros.cloud.itau.com.br/ITN/FatoresRisco%20IRFM.pdf"},{"titulo":"Política de distribuição de resultados","url":"https://assetfront.arquivosparceiros.cloud.itau.com.br/ITN/politica-de-distribuicao-de-resultados-IRFM.pdf"},{"titulo":"Demonstrações financeiras (exercício encerrado em 31/03/2026)","url":"https://assetfront.arquivosparceiros.cloud.itau.com.br/ITN/demonstracoes-financeiras-I   function ols(y, X, opts) {

    var n = y.length, i, j, l;

  // Ledoit & Wolf (2004) shrinkage toward μI, μ = tr(S)/p, on demeaned returns x_t with the paper's S = X'X/n:

    for (t = 0; t < n; t++) {

  // ======================================================================
  // Series alignment and returns
  // ======================================================================

  // Median gap (calendar days) between consecutive distinct valid dates: ≤4 → D (252/yr), ≤10 → W (52), else M (12).
  // null if fewer than 2 distinct dates.
  function inferFreq(dates) {
    if (!Array.isArray(dates)) return null;
    var seen = {}, d = [];
    for (var i = 0; i < dates.length; i++) {
      var dn = dayNum(dates[i]);
      if (dn !== null && !seen[dn]) { seen[dn] = true; d.push(dn); }
    }
    if (d.length < 2) return null;
    d.sort(function (a, b) { return a - b; });
    var gaps = [];
    for (i = 1; i < d.length; i++) gaps.push(d[i] - d[i - 1]);
    gaps.sort(function (a, b) { return a - b; });

    var f = med <= 4 ? 'D' : (med <= 10 ? 'W' : 'M');

  }

  // Keeps the LAST observation of each ISO week ('W') or calendar month ('M'), dated with its own date;
  // 'D' returns the sorted copy. Input is cleaned first: non-finite values and invalid dates dropped,
  // repeated dates keep the last occurrence. null if freq is not 'D'|'W'|'M'.
  function resample(points, freq) {
    if (!PPY[freq]) return null;
    var pts = cleanPoints(points);
    if (freq === 'D') return pts;
    var out = [];
    for (var i = 0; i < pts.length; i++) {
      var k = periodKey(pts[i][0], freq);
      if (i + 1 < pts.length && periodKey(pts[i + 1][0], freq) === k) continue;
      out.push([pts[i][0], pts[i][1]]);
    }
    return out;
  }

  // Aligns price series on a common calendar. Each series is cleaned, cut to [start, end], resampled to freq
  // (auto = the coarsest inferred freq among ids), then only periods where EVERY id has a value are kept
  // (listwise intersection). For W/M, series are matched by period (ISO week / month), not by exact day, so
  // different holiday calendars do not drop periods; the row date is the latest observation date in the period.
  // missing[id] = number of the id's own resampled periods dropped by the intersection.
  function alignPrices(seriesById, ids, opts) {
    opts = opts || {};
    if (!Array.isArray(ids) || ids.length === 0) return { ok: false, reason: 'nenhum ativo informado' };
    if (opts.freq !== undefined && opts.freq !== null && !PPY[opts.freq]) {
      return { ok: false, reason: 'frequência inválida: ' + opts.freq };
    }
    var start = opts.start, end = opts.end;
    if ((start && dayNum(start) === null) || (end && dayNum(end) === null)) return { ok: false, reason: 'data inválida na janela' };
    var cleaned = [], j;
    for (j = 0; j < ids.length; j++) {
      var id = ids[j];
      var pts = cleanPoints(seriesById ? seriesById[id] : null);
      if (!pts.length) return { ok: false, reason: 'sem série: ' + id };
      pts = pts.filter(function (pt) { return (!start || pt[0] >= start) && (!end || pt[0] <= end); });
      if (!pts.length) return { ok: false, reason: 'sem dados no período: ' + id };
      cleaned.push(pts);

    for (j = 0; j < ids.length; j++) missing[ids[j]] = maps[j].size - rows.length;
    if (!rows.length) return { ok: false, reason: 'sem datas em comum', freq: freq, missing: missing };
    return {
      ok: true,
      dates: rows.map(function (r) { return r.date; }),
      ids: ids.slice(),
      P: rows.map(function (r) { return r.vals; }),
      freq: freq,
      ppy: PPY[freq],
      missing: missing
    };
  }

  // Simple returns r_tj = P_tj / P_(t−1)j − 1; rows = P.length − 1. An entry is null when either price is
  // missing/non-finite or the previous price is 0 (nothing is filled in).
  function toReturns(P) {
    if (!Array.isArray(P)) return null;
    var out = [];
    for (var t = 1; t < P.length; t++) {
      if (!Array.isArray(P[t]) || !Array.isArray(P[t - 1]) || P[t].length !== P[t - 1].length) return null;
      var row = [];
      for (var j = 0; j < P[t].length; j++) {
        var a = P[t - 1][j], b = P[t][j];

      }
      out.push(row);
    }
    return out;
  }

  function toReturnsSeries(prices) {

    for (var t = 1; t < prices.length; t++) {

  function fxDecompose(rLocal, rFx) {

  function cumReturn(points, startDate, endDate) {

    var pts = cleanPoints(points);

    var i0 = -1, i1 = -1, i;
    for (i = 0; i < pts.length; i++) if (pts[i][0] >= startDate) { i0 = i; break; }
    for (i = pts.length - 1; i >= 0; i--) if (pts[i][0] <= endDate) { i1 = i; break; }
    if (i0 < 0 || i1 < 0 || i0 > i1) return { ok: false, reason: 'sem observações na janela' };

    if (dayNum(d1) < e - 7) return { ok: false, reason: 'série termina antes do fim da janela (' + d1 + ')', d0: d0, d1: d1 };
    if (pts[i0][1] === 0) return { ok: false, reason: 'valor inicial zero', d0: d0, d1: d1 };
    return { ok: true, r: pts[i1][1] / pts[i0][1] - 1, d0: d0, d1: d1 };
  }

  // Diagonal: N = own count, C = 1 (null when the own count < minObs or the series is constant).

  function pairwiseCorr(returnsById, ids, opts) {

  // ======================================================================
  // Portfolio risk

  function checkWS(w, S) { return isNumArray(w) && w.length > 0 && isSquare(S) && S.length === w.length; }

    return Math.sqrt(q);

  // null if σ = 0.

    var Sw = matVec(S, w);
    var mrc = Sw.map(function (v) { return v / sigma; });
    var ctr = mrc.map(function (v, i) { return w[i] * v; });
    var pct = ctr.map(function (v) { return v / sigma; });
    return { sigma: sigma, mrc: mrc, ctr: ctr, pct: pct };

  // Volatility before/after a weight change: delta = σ(wNew) − σ(w), same S for both.

  // r_p,t = Σ_j w_j·R_tj with the SAME weights every period, i.e. the portfolio is rebalanced back to w each period

  function portReturns(R, w) {

    for (var t = 0; t < R.length; t++) if (!Array.isArray(R[t]) || R[t].length !== w.length) return null;
    return R.map(function (row) {
      var s = 0;
      for (var j = 0; j < w.length; j++) {
        if (!isNum(row[j])) return null;
        s += w[j] * row[j];
      }
      return s;
    });
  }

  // wealth_t = Π_{s≤t}(1 + r_s) from initial capital 1; dd_t = wealth_t / max(1, max_{s≤t} wealth_s) − 1 (≤ 0).
  // mdd = min dd (≤ 0), current = last dd; trough = index of mdd, peak = index of the running peak before it
  // (−1 = the initial capital). peak/trough are null when there was no drawdown.
  function drawdown(returns) {

    var wealth = [], dd = [];
    for (var t = 0; t < returns.length; t++) {
