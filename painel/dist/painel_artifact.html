<title>Oregon Intelligence</title>
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="Oregon Intelligence: central de research e formação continuada. Hoje (briefing), Biblioteca (pesquisa, resumos semanais, aprendizados, fontes) e Oregon (ativos, carteiras, setores).">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Oregon Investment Desk — identidade do Painel Carteira Oregon original: IBM Plex em três papéis (Sans para leitura,
   Serif para títulos e números-chave, Mono para tabelas), fundo cinza-claro, cartões brancos, cores funcionais por pilar. */
:root{
  --bg:#F4F5F7;--panel:#FFFFFF;--panel2:#F8F9FB;--ink:#171A1F;--ink2:#353C45;--muted:#5D6672;--line:#E3E7EC;--line2:#C9D0D8;--row:#F3F5F8;
  --band:#343A40;--band-ink:#FFFFFF;
  --blue:#0D6EFD;--blue-ink:#0A58CA;--blue-soft:#E6EFFF;
  --up:#148A05;--up-bar:#1AAD06;--up-soft:#E5F6E2;--down:#CD3539;--down-soft:#FBE7E7;--amber:#FFB22B;--amber-soft:#FFF3DA;--warn:#9A6700;
  --crit:#CD3539;--alta:#B4530A;--media:#9A6700;
  --q:#6F42C1;--e:#0D6EFD;
  --br:#1D8C0F;--intl:#0B9AB8;--rf:#0D6EFD;--alt:#D63384;--sala:#343A40;
  --chip:#EDF0F5;--focus:#0D6EFD;
  --sans:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;--serif:"IBM Plex Serif",Georgia,"Times New Roman",serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --font:var(--sans);--r:8px;--r-sm:6px;--fs:16px;--shadow:none;--shadow-pop:0 12px 32px rgba(15,20,30,.18);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12171D;--panel:#1A2129;--panel2:#161C23;--ink:#E8ECF1;--ink2:#C9D0D8;--muted:#9AA5B1;--line:#2B3440;--line2:#3A4552;--row:#1F2731;
  --band:#0B0F13;--blue:#4D8DFF;--blue-ink:#8AB4FF;--blue-soft:rgba(77,141,255,.16);
  --up:#3CC425;--up-bar:#3CC425;--up-soft:rgba(60,196,37,.14);--down:#F0595C;--down-soft:rgba(240,89,92,.15);--amber-soft:rgba(255,178,43,.14);--warn:#FFB22B;
  --crit:#F0595C;--alta:#F0A050;--media:#E2B04A;--chip:#26303D;--sala:#9AA5B1;--shadow:none;--shadow-pop:0 12px 32px rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12171D;--panel:#1A2129;--panel2:#161C23;--ink:#E8ECF1;--ink2:#C9D0D8;--muted:#9AA5B1;--line:#2B3440;--line2:#3A4552;--row:#1F2731;
  --band:#0B0F13;--blue:#4D8DFF;--blue-ink:#8AB4FF;--blue-soft:rgba(77,141,255,.16);
  --up:#3CC425;--up-bar:#3CC425;--up-soft:rgba(60,196,37,.14);--down:#F0595C;--down-soft:rgba(240,89,92,.15);--amber-soft:rgba(255,178,43,.14);--warn:#FFB22B;
  --crit:#F0595C;--alta:#F0A050;--media:#E2B04A;--chip:#26303D;--sala:#9AA5B1;--shadow:none;--shadow-pop:0 12px 32px rgba(0,0,0,.5);color-scheme:dark}
*{box-sizing:border-box}
html{font-size:var(--fs);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue-ink)}
b,strong{font-weight:600}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.up{color:var(--up)}.down{color:var(--down)}.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:3px solid color-mix(in srgb,var(--focus) 55%,transparent);outline-offset:2px;border-radius:6px}

/* ---------- topo: marca, cinco seções, busca sempre à vista e hora da última coleta ---------- */
.top{position:sticky;top:0;z-index:30;background:var(--panel);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:18px;padding:0 24px;max-width:1400px;margin:0 auto;min-height:56px}
.brand{display:flex;align-items:baseline;gap:8px;white-space:nowrap;cursor:pointer;background:none;border:0;padding:0}
.brand b{font-family:var(--serif);font-weight:500;font-size:1.32rem;letter-spacing:-.01em;color:var(--ink)}
.brand small{font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600}
.nav{display:flex;gap:0;align-self:stretch}
.nav button{background:none;border:0;color:var(--muted);padding:0 12px;font-size:.93rem;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:7px;font-weight:500}
.nav button i{width:7px;height:7px;border-radius:2px;display:inline-block}
.nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
.nav button:hover{color:var(--ink)}
.nav .lab-s{display:none}
.top-r{margin-left:auto;display:flex;align-items:center;gap:10px;min-width:0}
.kbtn{display:flex;align-items:center;gap:8px;border:1px solid var(--line2);background:var(--panel2);color:var(--muted);border-radius:8px;padding:6px 10px;font-size:.88rem;cursor:pointer;white-space:nowrap}
.kbtn:hover{border-color:var(--ink2);color:var(--ink)}
.kbtn kbd{font-family:var(--mono);font-size:.72rem;border:1px solid var(--line2);border-radius:4px;padding:0 4px;background:var(--panel);margin-left:auto}
.qbox{width:clamp(220px,22vw,320px);text-align:left;cursor:text}
.qbox .qi{display:flex;flex:none}
.qbox .qp{overflow:hidden;text-overflow:ellipsis}
.qbox .qp-s{display:none}
.dstat{display:flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:4px 2px;font-size:.84rem;cursor:pointer;background:none;white-space:nowrap;color:var(--muted)}
.dstat b{color:var(--ink);font-weight:600;font-family:var(--mono);font-size:.82rem}
.dstat:hover{color:var(--ink)}
.dstat .ds-a{color:var(--warn);font-weight:600}
@media (max-width:1279px){.brand small{display:none}.nav .lab-l{display:none}.nav .lab-s{display:inline}.qbox{width:clamp(160px,18vw,240px)}.qbox .qp-l{display:none}.qbox .qp-s{display:inline}.dstat .ds-r{display:none}}
@media (max-width:960px){
  .top-in{flex-wrap:wrap;padding:0 12px;gap:8px 10px;min-height:0}
  .brand{order:1;padding:9px 0}.brand b{font-size:1.18rem}
  .top-r{order:2;flex:1;justify-content:flex-end;gap:8px}
  .qbox{flex:1;width:auto;max-width:360px;padding:6px 9px}.qbox kbd{display:none}
  .dstat .ds-l{display:none}
  .nav{order:3;flex:0 0 calc(100% + 24px);margin:0 -12px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-top:1px solid var(--line);min-height:42px}
  .nav button{justify-content:center;padding:0 2px;font-size:.84rem;gap:0}
  .nav button i{display:none}
}
.ctx{border-top:1px solid var(--line);background:var(--panel2)}
.ctx-in{display:flex;align-items:center;gap:14px;padding:8px 24px;max-width:1400px;margin:0 auto;flex-wrap:wrap}
.ctx label{font-size:.78rem;color:var(--muted);margin-right:6px}
.ctx select{border:1px solid var(--line2);background:var(--panel);border-radius:8px;padding:5px 8px;font-size:.9rem;max-width:260px}
.ctx .grow{flex:1}
.tbtn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:5px 11px;cursor:pointer;font-size:.86rem;white-space:nowrap;color:var(--ink2)}
.tbtn:hover{border-color:var(--line2);color:var(--ink)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:.8rem;font-weight:600;white-space:nowrap}
.pill.invalida{background:var(--down-soft);color:var(--down)}.pill.parcial{background:var(--amber-soft);color:var(--warn)}.pill.valida{background:var(--up-soft);color:var(--up)}
.pill.modo{background:var(--chip);color:var(--ink2);font-weight:500}
.simulado{background:repeating-linear-gradient(-45deg,var(--amber-soft),var(--amber-soft) 10px,transparent 10px,transparent 20px);border-bottom:1px solid var(--amber);text-align:center;font-size:.84rem;font-weight:600;color:var(--warn);padding:4px 10px}

/* ---------- layout ---------- */
main{padding:18px 24px 64px;max-width:1400px;margin:0 auto}
.page-h{display:flex;align-items:flex-end;gap:12px 16px;flex-wrap:wrap;margin:2px 0 14px}
.page-h h1{font-family:var(--serif);font-weight:400;font-size:clamp(1.45rem,2.4vw,1.85rem);line-height:1.12;margin:0;letter-spacing:-.01em}
.page-h .kick{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--muted);margin:0 0 4px}
.page-h p{margin:4px 0 0;color:var(--muted);max-width:90ch;font-size:.92rem}
.sub{display:flex;gap:4px;flex-wrap:wrap;margin:0 0 14px}
.sub button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 12px;cursor:pointer;font-size:.86rem;color:var(--ink2)}
.sub button:hover{border-color:var(--line2)}
.sub button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--panel)}
.grid2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:18px;align-items:start}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;align-items:start}
.grid-lab{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px;align-items:start}
.grid-emp{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:1100px){.grid2,.grid-lab,.grid3,.grid-emp{grid-template-columns:minmax(0,1fr)}.grid-emp .sticky{position:static;max-height:420px}}
.sec{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin-bottom:14px}
.sec>header{margin:0;padding:12px 16px 0;display:flex;align-items:baseline;gap:4px 10px;flex-wrap:wrap}
.sec>header h2{margin:0;font-size:.98rem;font-weight:600;letter-spacing:-.005em}
.sec>header .sh{flex-basis:100%;margin:0;font-size:.8rem}
.sec .body{padding:8px 16px 12px;overflow-x:auto}
.sec-n{font-size:.76rem;color:var(--muted);font-weight:500}
.sec .body.flush{padding:8px 0 4px}
.sec .body.flush>.tw table.t th:first-child,.sec .body.flush>.tw table.t td:first-child{padding-left:16px}
.hint{font-size:.82rem;color:var(--muted);margin:2px 0 6px;max-width:90ch;line-height:1.45}
.lead{font-size:1.02rem;margin:0 0 10px;color:var(--ink2)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.95rem}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.right{margin-left:auto}
.grow{flex:1}
.sticky{position:sticky;top:calc(var(--top-h,110px) + 12px);max-height:calc(100vh - var(--top-h,110px) - 24px);overflow:auto}
h3{font-size:.96rem;margin:14px 0 6px;font-weight:600}
.k{font-size:.72rem;letter-spacing:.13em;text-transform:uppercase;font-weight:600;color:var(--muted)}

/* ---------- botões e campos ---------- */
.btn{border:1px solid var(--line2);background:var(--panel);border-radius:8px;padding:6px 13px;cursor:pointer;font-size:.9rem;color:var(--ink)}
.btn:hover{border-color:var(--ink2)}
.btn.pri{background:var(--ink);border-color:var(--ink);color:var(--panel)}
.btn.pri:hover{opacity:.9}
.btn.danger{color:var(--down);border-color:color-mix(in srgb,var(--down) 45%,var(--line2))}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:3px 9px;font-size:.82rem}
.btn.link{border:0;background:none;color:var(--blue-ink);padding:2px 0}
.inp,select.inp,textarea.inp{border:1px solid var(--line2);background:var(--panel);border-radius:8px;padding:6px 9px;font-size:.94rem}
textarea.inp{width:100%;min-height:90px;resize:vertical}
.inp.w{width:100%}
.inp.n{width:84px;text-align:right;font-family:var(--mono)}
.field{display:flex;flex-direction:column;gap:3px;font-size:.86rem;color:var(--muted)}
.field>.inp{color:var(--ink)}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}

/* ---------- tabelas ---------- */
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:.9rem}
.t th,.t td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.t thead th{background:var(--panel);color:var(--muted);font-weight:600;position:sticky;top:0;white-space:nowrap;font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;border-bottom:1px solid var(--line2)}
.t thead th.s{cursor:pointer}.t thead th.s:after{content:" ↕";opacity:.45}
.t tbody tr:hover td{background:var(--row)}
.t td.r,.t th.r{text-align:right}
.t td.num{white-space:nowrap}
.t td.nw{white-space:nowrap}
.t tr.sel td{background:var(--blue-soft)}
.t tr.grp td{background:var(--panel2);color:var(--muted);font-weight:600;font-size:.74rem;letter-spacing:.08em;text-transform:uppercase}
.t tfoot td{font-weight:600;border-top:1px solid var(--line2)}
.t .bar{display:inline-block;height:7px;border-radius:2px;background:var(--blue);vertical-align:middle;margin-right:6px}
.t .bar.neg{background:var(--down)}
.t td .inp.n{padding:3px 6px}
.search{margin:0 0 8px;max-width:280px}

/* ---------- chips ---------- */
.chip{display:inline-block;border-radius:999px;padding:1px 8px;font-size:.74rem;font-weight:600;background:var(--chip);color:var(--ink2);white-space:nowrap;line-height:1.6}
.g-critica{background:var(--down-soft);color:var(--down)}.g-alta{background:color-mix(in srgb,var(--alta) 14%,transparent);color:var(--alta)}.g-media{background:var(--amber-soft);color:var(--warn)}.g-baixa,.g-info{background:var(--chip);color:var(--ink2)}
.o-q{background:color-mix(in srgb,var(--q) 14%,transparent);color:var(--q)}
.o-e{background:var(--blue-soft);color:var(--blue-ink)}
.o-ia{background:color-mix(in srgb,var(--q) 12%,transparent);color:var(--q)}
.o-obs{background:var(--up-soft);color:var(--up)}
.o-gestor{background:var(--blue-soft);color:var(--blue-ink)}
.st-placeholder{background:var(--down-soft);color:var(--down)}.st-aprovado{background:var(--up-soft);color:var(--up)}.st-em_analise{background:var(--amber-soft);color:var(--warn)}.st-descontinuado{background:var(--chip)}.st-proposta{background:var(--blue-soft);color:var(--blue-ink)}
.na{color:var(--muted);font-style:italic}
.na b{font-style:normal}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--line2);flex:none}
.dot.atualizado{background:var(--up-bar)}.dot.desatualizado{background:var(--amber)}.dot.suspeito{background:var(--alta)}.dot.indisponivel{background:var(--line2)}
.dot.completo{background:var(--up-bar)}.dot.parcial{background:var(--amber)}.dot.critico{background:var(--down)}

/* ---------- avisos ---------- */
.alert{border:1px solid color-mix(in srgb,var(--blue) 25%,var(--line));background:var(--blue-soft);padding:10px 14px;border-radius:8px;margin:8px 0;font-size:.92rem}
.alert.bad{border-color:color-mix(in srgb,var(--down) 30%,var(--line));background:var(--down-soft)}
.alert.warn{border-color:color-mix(in srgb,var(--amber) 45%,var(--line));background:var(--amber-soft)}
.alert.ok{border-color:color-mix(in srgb,var(--up) 25%,var(--line));background:var(--up-soft)}
.empty{padding:18px;text-align:center;color:var(--muted);font-size:.94rem}
.issues{list-style:none;margin:0;padding:0}
.issues li{padding:9px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:auto 1fr;gap:4px 10px}
.issues li:last-child{border-bottom:0}
.issues .d{grid-column:2;font-size:.88rem;color:var(--muted)}
details.x{border-top:1px solid var(--line)}
details.x>summary{cursor:pointer;padding:10px 18px;font-size:.9rem;color:var(--blue-ink);list-style:none}
details.x>summary::-webkit-details-marker{display:none}
details.x>summary:before{content:"▸ "}
details.x[open]>summary:before{content:"▾ "}
details.x>.body{padding:4px 18px 14px}
.ba table.t td{font-size:.88rem}
.ba .dlt{font-weight:600}

/* ---------- gráficos ---------- */
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font-family:var(--sans);font-size:12.5px;fill:var(--ink2)}
.chart .lab{fill:var(--ink)}.chart .val{font-family:var(--mono);font-size:12px}
.chart .ax{stroke:var(--line2)}.chart .grid{stroke:var(--line)}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--panel);padding:6px 9px;border-radius:6px;font-size:.8rem;opacity:0;z-index:5;max-width:300px;transition:opacity .1s;box-shadow:var(--shadow-pop)}
.legend{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:.82rem;color:var(--muted);margin:6px 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* ---------- gaveta e busca ---------- */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(580px,100%);background:var(--panel);border-left:1px solid var(--line);z-index:50;box-shadow:var(--shadow-pop);display:flex;flex-direction:column}
.drawer header{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.drawer header h2{margin:0;font-size:1.1rem;font-family:var(--serif);font-weight:500}
.drawer .body{overflow:auto;padding:14px 18px;flex:1}
.drawer .x{margin-left:auto;background:none;border:1px solid var(--line2);border-radius:8px;padding:4px 10px;cursor:pointer}
.drawer.wide{width:min(880px,100%)}
.mtd{font-size:.93rem}.mtd code{font-family:var(--mono);background:var(--row);padding:1px 4px;border-radius:3px}
.ibtn{border:1px solid var(--line2);background:var(--panel);color:var(--muted);border-radius:50%;width:20px;height:20px;font-size:.72rem;cursor:pointer;line-height:1;padding:0;font-weight:700;font-family:var(--serif)}
.ibtn:hover{color:var(--ink);border-color:var(--ink2)}
.cmdk-bg{position:fixed;inset:0;background:rgba(15,20,30,.35);z-index:70;display:flex;justify-content:center;align-items:flex-start;padding:12vh 16px 16px}
.cmdk{width:min(620px,100%);background:var(--panel);border-radius:12px;box-shadow:var(--shadow-pop);overflow:hidden;border:1px solid var(--line)}
.cmdk input{width:100%;border:0;border-bottom:1px solid var(--line);padding:14px 16px;font-size:1.05rem;background:var(--panel);outline:none}
.cmdk ul{list-style:none;margin:0;padding:6px;max-height:52vh;overflow:auto}
.cmdk li{padding:8px 10px;border-radius:8px;display:flex;gap:10px;align-items:baseline;cursor:pointer}
.cmdk li[aria-selected="true"],.cmdk li:hover{background:var(--row)}
.cmdk li small{color:var(--muted);margin-left:auto;font-size:.8rem;white-space:nowrap}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:8px;z-index:80;font-size:.92rem;max-width:90%;box-shadow:var(--shadow-pop)}

/* ---------- HOJE ---------- */
.desk-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:2px 0 18px}
.desk-h h1{font-family:var(--serif);font-weight:400;font-size:clamp(1.8rem,3.4vw,2.5rem);line-height:1.08;margin:0;letter-spacing:-.012em}
.desk-h .kick{font-size:.76rem;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--muted);margin:0 0 6px}
.desk-h .sum{margin:8px 0 0;font-size:1.06rem;color:var(--ink2);max-width:80ch}
.strip{--n:8;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:18px}
.strip.n5{--n:5}.strip.n6{--n:6}.strip.n11{--n:6}
@media (max-width:1250px){.strip{--n:4}.strip.n5{--n:5}.strip.n11{--n:4}}
@media (max-width:900px){.strip,.strip.n5,.strip.n6,.strip.n11{--n:3}}
@media (max-width:620px){.strip,.strip.n5,.strip.n6,.strip.n11{--n:2}}
.tile{background:var(--panel);padding:12px 14px 10px;display:flex;flex-direction:column;gap:2px;min-width:0;cursor:default;box-shadow:inset -1px 0 0 var(--line),inset 0 -1px 0 var(--line)}
.tile[data-click]{cursor:pointer}.tile[data-click]:hover{background:var(--panel2)}
.tile .lbl{font-size:.8rem;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .v{font-family:var(--serif);font-size:1.55rem;line-height:1.15;letter-spacing:-.01em;white-space:nowrap}
.tile .v small{font-size:.8rem;color:var(--muted);font-family:var(--sans);margin-left:3px}
.tile .d{font-family:var(--mono);font-size:.84rem;white-space:nowrap}
.tile .t{font-size:.76rem;color:var(--muted);display:flex;gap:8px;white-space:nowrap;overflow:hidden}
.tile .meta{font-size:.72rem;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.na .v{color:var(--muted);font-size:1.1rem}
.tile svg.spark{width:100%;height:26px;display:block;margin-top:2px}
.ev{display:grid;grid-template-columns:4px 1fr;gap:0 14px;padding:12px 0;border-bottom:1px solid var(--line)}
.ev:last-child{border-bottom:0}
.ev>.bar{border-radius:2px;background:var(--line2)}
.ev.decidir>.bar{background:var(--down)}.ev.investigar>.bar{background:var(--amber)}.ev.monitorar>.bar{background:var(--blue)}.ev.dados>.bar{background:var(--line2)}
.ev h4{margin:0 0 3px;font-size:1rem;font-weight:600;line-height:1.35}
.ev .fact{font-size:.92rem;color:var(--ink2)}
.ev .why{font-size:.9rem;margin-top:5px;display:grid;grid-template-columns:auto 1fr;gap:2px 10px}
.ev .why dt{color:var(--muted);font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;padding-top:2px}
.ev .why dd{margin:0}
.ev .src{font-size:.78rem;color:var(--muted);margin-top:5px}
.ev .acts{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap}
.cbars{display:flex;flex-direction:column;gap:2px}
.cbar{display:grid;grid-template-columns:minmax(110px,1.1fr) minmax(80px,2fr) 70px;gap:10px;align-items:center;padding:5px 6px;border-radius:6px;cursor:pointer;font-size:.9rem}
.cbar:hover{background:var(--row)}
.cbar .tr{height:10px;background:var(--row);border-radius:2px;position:relative}
.cbar .tr i{position:absolute;top:0;bottom:0;border-radius:2px}
.cbar .tr b{position:absolute;top:-3px;bottom:-3px;left:50%;width:1px;background:var(--line2)}
.cbar .n{font-family:var(--mono);font-size:.84rem;text-align:right;white-space:nowrap}
.cbar .cov{font-size:.74rem;color:var(--muted)}
.fam-h{font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:var(--muted);margin:10px 6px 2px;display:flex;align-items:center;gap:6px}
.fam-h i{width:8px;height:8px;border-radius:2px;display:inline-block}
.fq{font-size:.82rem;color:var(--muted);display:flex;gap:8px 16px;flex-wrap:wrap;align-items:center;padding:12px 2px;border-top:1px solid var(--line);margin-top:4px}
.fq span{display:inline-flex;align-items:center;gap:6px}
.fid{display:grid;grid-template-columns:auto auto 1fr;gap:6px 12px;font-size:.84rem;align-items:baseline}
.fid .lab{color:var(--muted)}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:900px){.three{grid-template-columns:1fr}}
.fbox{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--panel)}
.fbox .k{display:block;margin-bottom:4px}
.fbox.fato{border-top:3px solid var(--ink2)}.fbox.interp{border-top:3px solid var(--q)}.fbox.decisao{border-top:3px solid var(--blue)}

/* ---------- CARTEIRAS: mapa ---------- */
.fams{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:22px 28px}
.fam{min-width:0}
.fam>h3{display:flex;align-items:center;gap:8px;margin:0 0 10px;padding-bottom:6px;border-bottom:2px solid var(--line);font-size:.98rem}
.fam>h3 a,.fam>h3 button{margin-left:auto;font-size:.82rem;font-weight:500;background:none;border:0;color:var(--blue-ink);cursor:pointer}
.roscas{display:flex;flex-wrap:wrap;gap:12px 14px}
.rosca{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;padding:4px;border-radius:10px;cursor:pointer;width:96px}
.rosca:hover{background:var(--row)}
.rosca[aria-current="true"]{background:var(--blue-soft)}
.rosca svg{width:80px;height:80px;display:block}
.rosca b{font-size:.86rem;font-weight:600}
.rosca small{font-size:.72rem;color:var(--muted)}
.rosca .err{background:var(--down);color:#fff;border-radius:999px;padding:0 6px;font-size:.68rem;font-weight:600}
.rosca svg text{font-family:var(--serif);font-size:15px;fill:var(--ink)}
.rosca svg text.s{font-family:var(--sans);font-size:7px;fill:var(--muted)}
.plegend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.78rem;color:var(--muted);margin:0 0 14px}
.plegend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.hm{width:100%;border-collapse:separate;border-spacing:3px;font-size:.82rem}
.hm th{font-weight:600;color:var(--muted);font-size:.74rem;text-align:center;padding:2px 0}
.hm th.l{text-align:left;font-size:.86rem;color:var(--ink);font-weight:500;padding-right:8px;white-space:nowrap}
.hm td{text-align:center;border-radius:4px;padding:5px 0;font-family:var(--mono);font-size:.76rem;min-width:34px;position:relative}
.hm td.z{color:var(--line2)}
.hm td i{position:absolute;top:2px;right:2px;width:5px;height:5px;border-radius:50%;background:var(--down)}
.hm tr.g th{text-align:left;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;padding-top:10px}
.hm tr.r{cursor:pointer}.hm tr.r:hover th.l{color:var(--blue-ink)}
.chg{display:grid;grid-template-columns:1fr auto auto;gap:4px 12px;font-size:.9rem;align-items:center}
.chg .p{display:flex;align-items:center;gap:6px}.chg .p i{width:9px;height:9px;border-radius:2px}
.chg .w{font-family:var(--mono);font-size:.84rem;color:var(--muted)}
.chg h4{grid-column:1/-1;margin:10px 0 2px;font-size:.92rem}
.pbars{display:flex;flex-direction:column;gap:12px}
.pbar .hd{display:flex;align-items:center;gap:8px;font-size:.92rem}
.pbar .hd i{width:10px;height:10px;border-radius:2px}
.pbar .hd .w{margin-left:auto;font-family:var(--mono);font-size:.86rem}
.pbar .trk{position:relative;height:12px;background:var(--row);border-radius:3px;margin:5px 0 3px}
.pbar .trk .band{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--ink) 9%,transparent);border-radius:3px}
.pbar .trk .fill{position:absolute;top:2px;bottom:2px;left:0;border-radius:2px}
.pbar .trk .tgt{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
.pbar .trk .base{position:absolute;top:-3px;width:8px;height:8px;margin-left:-4px;border-radius:50%;border:2px solid var(--muted);background:var(--panel);top:2px}
.pbar .sm{font-size:.78rem;color:var(--muted)}
.pbar.out .hd .w{color:var(--down)}
.sb-wrap{display:grid;grid-template-columns:minmax(260px,420px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:900px){.sb-wrap{grid-template-columns:1fr}}
.sb svg{width:100%;height:auto;display:block}
.sb path{stroke:var(--panel);stroke-width:1;cursor:pointer}
.sb path:hover{opacity:.82}
.sb text{font-family:var(--sans);font-size:8.5px;fill:#fff;pointer-events:none}
.sb text.c{font-family:var(--serif);font-size:20px;fill:var(--ink)}
.sb text.cs{font-size:8px;fill:var(--muted)}

/* ---------- GLOBAL ---------- */
.tx{display:grid;grid-template-columns:minmax(150px,.9fr) minmax(0,2.2fr) minmax(140px,1fr);gap:14px;padding:13px 0;border-bottom:1px solid var(--line);align-items:start}
.tx:last-child{border-bottom:0}
.tx .drv b{display:block;font-size:.98rem}
.tx .drv .v{font-family:var(--serif);font-size:1.3rem}
.tx .mec{font-size:.92rem;color:var(--ink2)}
.tx .mec ol{margin:4px 0 0;padding-left:18px}
.tx .exp{font-size:.86rem}
@media (max-width:900px){.tx{grid-template-columns:1fr}}

/* ---------- ata / sala ---------- */
.fala{display:grid;grid-template-columns:150px 1fr;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.fala b{color:var(--blue-ink)}
.passo{display:grid;grid-template-columns:34px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.passo .n{width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--panel);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.88rem}
.passo h4{margin:2px 0 6px;font-size:.98rem}
.badge-ia{display:inline-block;background:color-mix(in srgb,var(--q) 12%,transparent);color:var(--q);border-radius:999px;padding:1px 9px;font-size:.78rem;font-weight:600}
.tests li{padding:4px 0;font-size:.9rem}

/* ---------- teses e research ---------- */
.tk{border:0;background:none;padding:0;font:inherit;font-weight:600;color:var(--ink);cursor:pointer;border-bottom:1px dotted var(--line2)}
.tk.tem{color:var(--blue-ink);border-bottom-color:color-mix(in srgb,var(--blue) 50%,transparent)}
.tk:hover{color:var(--blue)}
.tv{font-size:.98rem;line-height:1.58}
.tv p{margin:0 0 8px}
.tv-crumb{font-size:.74rem;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 4px}
.tv-nome{font-family:var(--serif);font-weight:400;font-size:1.9rem;margin:0 0 8px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;line-height:1.1}
.tv-tk{background:var(--ink);color:var(--panel);border-radius:4px;padding:2px 8px;font-size:.8rem;font-weight:600;letter-spacing:.02em;font-family:var(--sans)}
.tv-peso{border:1px solid var(--line2);border-radius:999px;padding:1px 9px;font-size:.8rem;font-weight:600;color:var(--ink2);font-family:var(--sans)}
.tv-ctx{font-size:.86rem;color:var(--muted)}
.tv-lead{border-left:3px solid var(--ink);padding:2px 0 2px 14px;font-size:1.04rem}
.tv-k{font-size:.72rem;letter-spacing:.13em;text-transform:uppercase;font-weight:700;color:var(--blue-ink)}
.tv-sec{border-bottom:1px solid var(--line);padding-bottom:4px;margin:18px 0 8px}
.tv h3{font-size:1rem;margin:4px 0 4px}
.tv-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:10px 0}
.tv-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.tv-box{border-radius:8px;padding:12px 14px}
.tv-papel{background:var(--panel2);border:1px solid var(--line)}
.tv-q{background:var(--blue-soft);border-left:3px solid var(--blue)}
.tv-q p{font-weight:600}
.tv-n{font-family:var(--serif);font-size:1.5rem;font-weight:400;color:var(--ink);border-top:2px solid var(--ink);padding-top:4px}
.tv-num{background:var(--panel2);border-left:3px solid var(--blue);padding:10px 12px;border-radius:6px}
.tv-ind{margin:0;padding-left:18px}.tv-ind li{margin-bottom:6px;font-weight:500}
.tv-r{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
.tv-risco{border-left:3px solid var(--down);padding:2px 0 2px 12px}
.tv-risco.tv-neutro{border-left-color:var(--blue)}
.tv-crit{background:var(--band);color:#fff;border-radius:8px;padding:12px 16px;margin:16px 0 8px}
.tv-crit .tv-k{color:#9ec5fe}
.tv-crit ul{margin:8px 0 0;padding-left:18px}.tv-crit li{margin-bottom:6px}
.tv-fontes{font-size:.8rem;color:var(--muted)}
.tv-nota{font-size:.92rem;color:var(--ink2);background:var(--panel2);padding:8px 12px;border-radius:6px}
.tv-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin:12px 0}
.tv-card{text-align:left;border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:12px 14px;cursor:pointer;font:inherit;color:inherit;display:flex;flex-direction:column;gap:4px}
.tv-card:hover{border-color:var(--line2);box-shadow:0 4px 14px rgba(16,24,40,.08)}
.tv-cq{font-size:.88rem;color:var(--ink2)}
.vbox{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:10px 0}
.vbox>div{background:var(--panel);padding:9px 12px}
.vbox .k{display:block}
.vbox b{font-family:var(--serif);font-weight:400;font-size:1.3rem}
.vbox small{display:block;font-size:.74rem;color:var(--muted)}
.pilchips{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
@media (max-width:760px){.tv-2,.tv-3,.tv-r{grid-template-columns:1fr}}
.sens{border-collapse:separate;border-spacing:2px;font-size:.84rem;width:100%}
.sens th{font-size:.74rem;color:var(--muted);font-weight:600;text-align:center;padding:3px}
.sens th.l{text-align:left;color:var(--ink);font-size:.86rem;font-weight:500;white-space:nowrap}
.sens td{text-align:center;padding:6px 2px;border-radius:4px;font-weight:600;min-width:52px}
.sens td.p{background:var(--up-soft);color:var(--up)}.sens td.n{background:var(--down-soft);color:var(--down)}.sens td.z{color:var(--line2)}

/* ---- Mercado e notícias ---- */
.mkt-faixa{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:10px 14px;margin:0 0 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);font-size:.93rem}
.mkt-faixa .btn{margin-left:auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:10px}
.kpi{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.kpi small{color:var(--muted);font-size:.82rem}
.kpi b{font-size:1.45rem;font-family:var(--serif);font-weight:400}
.kpi span{font-size:.82rem}
.noticia{padding:11px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.noticia:last-child{border-bottom:0}
.noticia a{font-weight:600;font-size:.98rem;color:var(--ink);text-decoration:none}
.noticia a:hover{color:var(--blue-ink);text-decoration:underline}
.noticia .teste{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:.9rem;display:flex;flex-direction:column;gap:4px}

/* ---------- briefing (Hoje) ---------- */
.upd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.82rem;color:var(--muted);margin-top:8px}
.upd .btn.link{font-size:.82rem}
.strip.mini .tile{padding:8px 12px 7px}.strip.mini .tile .v{font-size:1.2rem}
.sub2{margin-top:-8px}.sub2 button{font-size:.84rem;padding:3px 11px}
.filt{margin:2px 0 6px}.filt button:disabled{opacity:.4;cursor:default}
.nw{position:relative;padding:12px 0 12px 14px;border-bottom:1px solid var(--line)}
.nw:last-child{border-bottom:0}
.nw::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:2px;background:var(--line2)}
.nw.c-empresas::before{background:var(--br)}.nw.c-juros::before{background:var(--blue)}.nw.c-commodities::before{background:var(--amber)}.nw.c-mundo::before{background:var(--intl)}.nw.c-brasil::before{background:var(--ink2)}
.nw-meta{display:flex;align-items:center;gap:6px 10px;flex-wrap:wrap;font-size:.78rem;color:var(--muted)}
.nw-cat{font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:.7rem;color:var(--ink2)}
.nw h3{margin:4px 0 4px;font-family:var(--serif);font-weight:500;font-size:1.12rem;line-height:1.3;letter-spacing:-.005em}
.nw h3 a{color:var(--ink);text-decoration:none}.nw h3 a:hover{color:var(--blue-ink);text-decoration:underline}
.nw-why{margin:0;font-size:.9rem;color:var(--ink2)}.nw-why b{font-weight:600;color:var(--muted);font-size:.78rem;letter-spacing:.05em;text-transform:uppercase}
.nw-links{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.nwl{border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:2px 10px;font-size:.8rem;cursor:pointer;color:var(--ink2)}
.nwl:hover{border-color:var(--ink2);color:var(--ink)}.nwl.tkl{font-weight:600;color:var(--blue-ink)}.nwl small{color:var(--muted);font-weight:400}
.mud{display:flex;flex-direction:column}
.mud-r{display:grid;grid-template-columns:minmax(0,1.3fr) auto 86px;grid-template-areas:"n lv vv" "rr rr rr" "src src src";gap:2px 10px;align-items:baseline;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:8px 2px;cursor:pointer;width:100%}
.mud-r:hover{background:var(--row)}
.mud-r .n{grid-area:n;font-weight:500}.mud-r .lv{grid-area:lv;font-family:var(--mono);font-size:.84rem;color:var(--ink2)}.mud-r .vv{grid-area:vv;font-family:var(--mono);font-size:.86rem;text-align:right}
.mud-r .rr{grid-area:rr;height:4px;background:var(--row);border-radius:2px;display:flex;align-items:center;margin:3px 0 1px}
.mud-r .rr i{display:block;height:4px;border-radius:2px;background:var(--line2)}.mud-r.forte .rr i{background:var(--amber)}
.mud-r .src em{font-style:normal;font-weight:700;color:var(--warn)}
.mud-r .src{grid-area:src;font-size:.74rem;color:var(--muted)}
.mud-x{margin:10px 0 0;padding-left:18px;font-size:.88rem;display:flex;flex-direction:column;gap:4px}
.ref-st{font-size:.76rem;margin:0 6px 6px;padding:3px 8px;border-radius:6px}.ref-st.invalida{background:var(--down-soft);color:var(--down)}.ref-st.parcial{background:var(--amber-soft);color:var(--warn)}
.agenda{list-style:none;margin:0;padding:0}
.agenda li{display:grid;grid-template-columns:62px 1fr;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:.9rem;align-items:baseline}
.agenda li:last-child{border-bottom:0}
.ag-d b{display:block;font-family:var(--mono);font-weight:500}.ag-d small{color:var(--muted);font-size:.74rem}
.agenda li.ag-copom .ag-d b{color:var(--br)}.agenda li.ag-fomc .ag-d b{color:var(--intl)}
.emp-hoje{display:flex;flex-direction:column}
.eh{display:grid;grid-template-columns:72px 1fr;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);align-items:start}
.eh:last-child{border-bottom:0}
.eh-tk{border:1px solid var(--line2);background:var(--panel);border-radius:6px;padding:4px 0;font-weight:700;font-size:.84rem;cursor:pointer;color:var(--ink)}
.eh-tk:hover{border-color:var(--ink);color:var(--blue-ink)}
.eh-l{display:flex;gap:6px 10px;flex-wrap:wrap;align-items:baseline;font-size:.92rem}.eh-l b{font-family:var(--mono);font-size:.86rem}.eh-l small{font-size:.76rem}
.eh-n{font-size:.88rem;margin-top:2px}.eh-n a{color:var(--ink)}
.cx-f{margin:0 0 8px}
.cx-m{margin:0 0 8px;padding-left:20px;font-size:.92rem;display:flex;flex-direction:column;gap:3px}
.cx-r{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;font-size:.9rem;margin-top:8px}.cx-r .k{flex-basis:100%}
.cx-b b{font-family:var(--mono);font-size:.86rem}
.sec.ex{border-color:color-mix(in srgb,var(--q) 35%,var(--line));background:linear-gradient(180deg,color-mix(in srgb,var(--q) 5%,var(--panel)),var(--panel) 120px)}
.ex-q{font-family:var(--serif);font-size:1.25rem;line-height:1.4;margin:4px 0 8px;max-width:80ch}
.ex-nota{min-height:64px;margin-bottom:10px}
.ex-d{border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.ex-d>summary{cursor:pointer;padding:9px 12px;font-weight:600;color:var(--q)}
.ex-r{padding:0 14px 12px;font-size:.94rem}.ex-r h4{margin:14px 0 4px;font-size:.9rem;letter-spacing:.02em}
.ex-r ul{margin:4px 0;padding-left:20px;display:flex;flex-direction:column;gap:3px}
.ex-t{max-width:640px}
.ex-sv{display:flex;flex-wrap:wrap;gap:6px 16px}
/* ---------- Carteiras · referência ---------- */
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:10px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;padding:8px 18px;font-size:1rem;cursor:pointer;color:var(--ink2);font-weight:500}
.seg button+button{border-left:1px solid var(--line2)}
.seg button[aria-selected="true"]{background:var(--ink);color:var(--panel);font-weight:600}
table.cmp td.sel,table.cmp th.sel{background:var(--blue-soft);font-weight:600}

.ficha-kpi .vbox b{font-size:1.15rem}
.ficha-head .tv{margin-bottom:2px}
.fv{display:flex;gap:0;border-bottom:1px solid var(--line2);margin:10px 0 12px;overflow-x:auto;scrollbar-width:none}
.fv::-webkit-scrollbar{display:none}
.fv button{border:0;background:none;padding:8px 12px;font-size:.88rem;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;cursor:pointer;font-weight:500;display:flex;gap:6px;align-items:baseline}
.fv button:hover{color:var(--ink)}
.fv button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
.fv button small{font-family:var(--mono);font-size:.72rem;color:var(--muted)}
.tk-strip{display:none}
@media (max-width:1280px){.ficha-grid{grid-template-columns:minmax(0,1fr);grid-template-areas:"head" "news" "kpi" "main";grid-template-rows:auto}.ficha-news{position:static;max-height:none;margin-bottom:12px}}
@media (max-width:1100px){
  .grid-emp{grid-template-columns:minmax(0,1fr)}
  .grid-emp .ficha-at{order:1}.grid-emp .lista-at{order:2;position:static;max-height:none}
  .tk-strip{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:0 0 12px;padding-bottom:2px}
  .tk-strip::-webkit-scrollbar{display:none}
  .tk-strip button{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:4px 9px;font-family:var(--mono);font-size:.8rem;cursor:pointer;color:var(--ink2);display:flex;gap:5px;align-items:baseline}
  .tk-strip button small{font-size:.68rem;color:var(--blue-ink);font-weight:600}
  .tk-strip button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--panel)}
  .tk-strip button[aria-pressed="true"] small{color:var(--panel)}
}
@media (max-width:640px){.ficha-head .tv-nome{font-size:1.3rem}.ficha-news{padding:10px 12px}.fv button{padding:8px 10px;font-size:.84rem}}

/* Biblioteca: busca e atalhos à vista, demais filtros recolhidos */
.busca-l{display:flex;gap:6px 12px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.busca-l .sub.filt{margin:0}
.mais-f>summary{cursor:pointer;font-size:.84rem;color:var(--blue-ink);padding:2px 0;list-style:none}
.mais-f>summary::-webkit-details-marker{display:none}
.mais-f>summary:before{content:"+ "}
.mais-f[open]>summary:before{content:"− "}
.mais-f>.filtros{margin-top:8px}

},"usd":{"n":"Dólar (PTAX)","v":5.48,"u":"R$","fonte":"PTAX de 04/11/2026 (deck)","data":"04/11/2026"}},"teses_pdf":{"fonte":"Carteira Oregon · Teses de Investimento (oregon invest). Analista responsável: Lucas Lima, CNPI 8024. Elaboração: 30/10/2026.","data":"2026-10-30","teses":{"PETR4":{"pagina":7,"pilar_crumb":"PILAR 5 · DIVIDENDOS / PETRÓLEO E GÁS","nome":"Petrobras","ticker":"PETR4","peso":"15% do Pilar 5","resumo":"O pré-sal permite à Petrobras produzir petróleo a custos competitivos e gerar caixa mesmo em cenários menos favoráveis para o barril. Com investimentos disciplinados, essa vantagem sustenta seu potencial de distribuição de dividendos.","papel_titulo":"Renda e diversificação diante de choques geopolíticos","papel":"Complementa as empresas voltadas ao mercado doméstico com receitas atreladas ao petróleo e ao dólar. Em choques que elevam o Brent, a geração de caixa pode funcionar como contrapeso a outros setores da carteira.","questao":"Mesmo com oscilações no preço do petróleo, o pré-sal continuará gerando caixa para investir com retorno e distribuir dividendos?","fundamentos":[{"titulo":"Competitividade do pré-sal","texto":"A produtividade dos reservatórios dilui os custos fixos por barril e contribui para margens competitivas ao longo do ciclo do petróleo."},{"titulo":"Produção e reposição de reservas","texto":"Novos poços e plataformas ajudam a compensar o declínio natural dos campos. A exploração de novas áreas pode repor reservas e ampliar o potencial de produção futura."},{"titulo":"Remuneração e disciplina de capital","texto":"Os dividendos dependem da geração de caixa e do endividamento. Priorizar investimentos rentáveis é essencial para sustentar a produção e a remuneração dos acionistas."}],"numeros":["A política vigente prevê distribuir 45% do fluxo de caixa livre, condicionada às regras de capital e ao limite de dívida bruta de US$ 75 bilhões no plano 2026–2030."],"indicadores":["Brent, câmbio e geração de caixa livre","Investimentos e reposição de reservas","Endividamento e política de proventos"],"riscos":[{"titulo":"Brent e câmbio","texto":"Preço internacional menor reduz geração de caixa e dividendos."},{"titulo":"Influência do controlador","texto":"Decisões sobre preços dos combustíveis, investimentos e dividendos podem priorizar objetivos que não maximizem o retorno ao acionista."},{"titulo":"Reposição de reservas","texto":"A exploração de novas áreas depende de licenças e investimentos, com incertezas sobre descobertas e retornos."},{"titulo":"Refino e alocação de capital","texto":"Investimentos em refino e outros negócios podem reduzir a geração de valor se não apresentarem retornos compatíveis com o capital empregado."}],"criterios":["Interferência recorrente na política de preços ou em decisões de investimento que comprometam a criação de valor.","Revisão da política de remuneração, elevação estrutural do endividamento ou expansão de baixo retorno que limitem a distribuição de proventos.","Cotação que já incorpore a geração de caixa e os dividendos esperados, reduzindo o potencial de retorno diante dos riscos do negócio."],"fontes":"Fontes: Petrobras, Plano Estratégico 2026–2030 e política de remuneração aos acionistas; RI (investidorpetrobras.com.br)."},"KLBN4":{"pagina":8,"pilar_crumb":"PILAR 5 · DIVIDENDOS / PAPEL, CELULOSE E EMBALAGENS","nome":"Klabin","ticker":"KLBN4","peso":"15% do Pilar 5","resumo":"Após um longo ciclo de expansão, a Klabin entra em uma fase de maior foco na geração de caixa e na redução da dívida. A atuação em celulose, papéis e embalagens oferece diferentes fontes de resultado ao longo dos ciclos econômicos.","papel_titulo":"Diversificação e geração de renda","papel":"A combinação de celulose, papéis e embalagens reduz a dependência de um único mercado. A exposição internacional, aliada a negócios ligados ao consumo, contribui para a diversificação e a resiliência da carteira.","questao":"Com a redução dos investimentos, a Klabin conseguirá gerar mais caixa, diminuir a dívida e fortalecer os dividendos?","fundamentos":[{"titulo":"Integração florestal e industrial","texto":"Florestas próprias e fábricas integradas ampliam o controle sobre o fornecimento de madeira e os custos de produção, fortalecendo a competitividade."},{"titulo":"Diversificação dos negócios","texto":"A celulose acompanha os preços internacionais, enquanto papéis e embalagens atendem diferentes mercados de consumo e indústria. Essa combinação reduz a dependência de um único produto."},{"titulo":"Nova fase de geração de caixa","texto":"Com os grandes projetos de expansão concluídos, a redução gradual dos investimentos pode liberar mais caixa para diminuir a dívida e ampliar a capacidade de remuneração dos acionistas."}],"numeros":["Em 2025, papéis e embalagens representaram cerca de 69% da receita. Os investimentos previstos recuam de R$ 3,3 bilhões em 2026 para R$ 2,8 bilhões em 2027 e R$ 2,5 bilhões em 2028."],"indicadores":["Geração de caixa após os investimentos","Redução do endividamento e despesas financeiras","Rentabilidade das operações e sustentabilidade dos dividendos"],"riscos":[{"titulo":"Celulose e câmbio","texto":"Preços internacionais menores e valorização do real podem pressionar margens e geração de caixa."},{"titulo":"Custos e estoques","texto":"Custos elevados e maior necessidade de estoques podem comprometer a geração de caixa."},{"titulo":"Alavancagem","texto":"Dívida elevada por mais tempo pode limitar a capacidade de investimentos e distribuição de dividendos."},{"titulo":"Alocação de capital","texto":"Novos projetos de grande porte podem adiar a redução da dívida e o retorno dos investimentos já realizados."}],"criterios":["Investimentos que não recuem conforme o esperado, sem melhora correspondente da geração de caixa.","Endividamento persistentemente elevado ou novos projetos com retorno insuficiente sobre o capital empregado.","Cotação que já reflita a expectativa de maior geração de caixa e dividendos, reduzindo o retorno potencial em relação aos riscos."],"fontes":"Fontes: Klabin, divulgações de resultados e projeções de investimento; RI (ri.klabin.com.br)."},"BBSE3":{"pagina":9,"pilar_crumb":"PILAR 5 · DIVIDENDOS / SEGUROS E PREVIDÊNCIA","nome":"BB Seguridade","ticker":"BBSE3","peso":"15% do Pilar 5","resumo":"A BB Seguridade combina seguros, previdência e distribuição pela rede do Banco do Brasil. A escala comercial, a diversificação dos resultados e a elevada capacidade de pagamento de dividendos sustentam seu perfil defensivo.","papel_titulo":"Renda defensiva e resiliência operacional","papel":"Com menor exposição direta ao crédito e comportamento historicamente menos sensível às oscilações do mercado, a companhia combina renda recorrente e diversificação dentro do setor financeiro.","questao":"A BB Seguridade conseguirá sustentar lucros e dividendos ao longo dos ciclos, preservando sua vantagem na distribuição pelo Banco do Brasil?","fundamentos":[{"titulo":"Rede de distribuição como diferencial","texto":"O acesso à ampla rede do Banco do Brasil permite comercializar seguros e previdência com escala, utilizando uma estrutura comercial já estabelecida."},{"titulo":"Resiliência operacional e financeira","texto":"Seguros e previdência respondem de maneiras diferentes aos ciclos econômicos. Juros elevados podem favorecer o resultado financeiro, enquanto a recuperação do crédito estimula a comercialização de produtos."},{"titulo":"Elevada capacidade de distribuição","texto":"A corretagem exige pouco capital para operar e crescer, favorecendo a distribuição de uma parcela relevante dos lucros, respeitadas as necessidades de capital dos negócios de seguros."}],"numeros":["Entre 2020 e 2025, dividendos e recompras corresponderam a aproximadamente 89% do lucro acumulado."],"indicadores":["Resultado operacional e financeiro","Sinistralidade e desempenho das operações de seguros","Acordos comerciais com o Banco do Brasil e sustentabilidade dos dividendos"],"riscos":[{"titulo":"Sinistralidade e eventos climáticos","texto":"Secas, geadas e outros eventos climáticos podem elevar as indenizações, especialmente nos seguros rurais."},{"titulo":"Crédito e atividade econômica","texto":"A desaceleração do crédito pode reduzir a comercialização de seguros vinculados a financiamentos."},{"titulo":"Taxas de juros","texto":"Juros menores podem reduzir o rendimento das aplicações financeiras, embora favoreçam a retomada de negócios ligados ao crédito."},{"titulo":"Dependência do Banco do Brasil","texto":"A rede do BB é uma vantagem competitiva, mas também uma concentração relevante. Renovações contratuais menos favoráveis podem comprometer margens e resultados."}],"criterios":["Renovação dos acordos com o Banco do Brasil em condições que comprometam a vantagem competitiva da distribuição.","Deterioração persistente dos resultados operacionais ou da capacidade de distribuir dividendos.","Cotação que já incorpore os lucros e dividendos esperados, sem retorno potencial suficiente diante dos riscos do negócio."],"fontes":"Fontes: BB Seguridade, demonstrações financeiras e divulgações de resultados de 2020 a 2025; RI (bbseguridaderi.com.br)."},"ITSA4":{"pagina":10,"pilar_crumb":"PILAR 5 · DIVIDENDOS / HOLDINGS E SERVIÇOS FINANCEIROS","nome":"Itaúsa","ticker":"ITSA4","peso":"15% do Pilar 5","resumo":"A Itaúsa oferece exposição ao Itaú, um dos bancos mais rentáveis e com melhor qualidade de crédito do país, por meio de uma holding que historicamente negocia com desconto em relação ao valor de suas participações.","papel_titulo":"Qualidade financeira com desconto de holding","papel":"A posição reúne a elevada rentabilidade do Itaú, recebimento recorrente de proventos e potencial de valorização adicional caso o desconto da holding diminua.","questao":"A qualidade do Itaú, combinada ao desconto da holding, continuará oferecendo retorno atrativo aos acionistas da Itaúsa?","fundamentos":[{"titulo":"Qualidade e rentabilidade do Itaú","texto":"A escala, a disciplina na concessão de crédito e a diversificação das receitas sustentam uma rentabilidade elevada e resultados consistentes ao longo dos ciclos econômicos."},{"titulo":"Desconto de holding","texto":"A Itaúsa pode negociar por um valor inferior ao de suas participações, consideradas as dívidas e demais obrigações. Esse desconto oferece potencial de valorização adicional caso diminua."},{"titulo":"Eficiência tributária e proventos","texto":"Os resultados recebidos do Itaú sustentam a remuneração dos acionistas. A partir de 2027, o fim previsto do PIS/Cofins sobre JCP recebidos reduz uma ineficiência da holding e pode favorecer sua valorização."}],"numeros":["Entre 2020 e 2025, o desconto da holding variou de 19% a 26% nos fechamentos anuais. No 2T26, o Itaú apresentou ROE de 24,3% e inadimplência de 1,9%."],"indicadores":["Rentabilidade e qualidade da carteira de crédito do Itaú","Desconto da holding em relação ao valor líquido das participações","Eficiência tributária, alocação de capital e distribuição de proventos"],"riscos":[{"titulo":"Concentração no Itaú","texto":"A Itaúsa depende predominantemente dos resultados do Itaú, ficando exposta à qualidade do crédito e à rentabilidade do banco."},{"titulo":"Desconto persistente","texto":"O desconto pode permanecer elevado, mesmo com bons resultados do Itaú, limitando a valorização adicional."},{"titulo":"Alocação de capital","texto":"Novos investimentos com rentabilidade insuficiente podem comprometer a criação de valor para os acionistas."},{"titulo":"Custos e estrutura tributária","texto":"Despesas financeiras, administrativas e tributárias podem reduzir o benefício econômico de investir por meio da holding."}],"criterios":["Perda persistente da capacidade do Itaú de gerar rentabilidade acima do custo de capital.","Decisões de investimento ou custos da holding que comprometam a criação de valor para seus acionistas.","Cotação que já incorpore a qualidade do Itaú e os ganhos esperados com a redução do desconto, sem retorno potencial suficiente diante dos riscos."],"fontes":"Fontes: Itaúsa, divulgações de resultados de 2020 a 2025 (ri.itausa.com.br); Itaú Unibanco, resultado do 2T26 (itau.com.br/relacoes-com-investidores)."},"BBDC4":{"pagina":11,"pilar_crumb":"PILAR 5 · DIVIDENDOS / BANCOS E SEGUROS","nome":"Bradesco","ticker":"BBDC4","peso":"10% do Pilar 5","resumo":"O Bradesco combina uma franquia bancária consolidada com uma relevante operação de seguros. O plano de transformação iniciado na gestão Marcelo Noronha busca recuperar a eficiência e elevar a rentabilidade de forma sustentável.","papel_titulo":"Renda bancária e recuperação de rentabilidade","papel":"A ampla atuação no setor financeiro e a operação de seguros sustentam fontes diversificadas de lucro. A recuperação da eficiência e do crédito acrescenta potencial de valorização, com maior sensibilidade ao ciclo econômico.","questao":"O plano de transformação permitirá ao Bradesco recuperar uma rentabilidade sustentável acima do custo de capital?","fundamentos":[{"titulo":"Franquia bancária e ciclo econômico","texto":"A ampla base de clientes e a atuação em diferentes segmentos de crédito oferecem oportunidades de crescimento. Uma economia mais forte pode favorecer a demanda por crédito e reduzir perdas com inadimplência."},{"titulo":"Transformação e eficiência","texto":"O plano iniciado na gestão Marcelo Noronha moderniza a estrutura, amplia o uso de tecnologia e busca melhorar a produtividade. Esses avanços podem reduzir custos e elevar a eficiência operacional."},{"titulo":"Recuperação da rentabilidade","texto":"A combinação de crédito mais bem precificado, controle de despesas e contribuição dos seguros pode elevar o retorno sobre o patrimônio, aproximando o banco de níveis historicamente mais elevados."}],"numeros":["O ROE passou de 10,0% em 2023 para 14,8% em 2025. O índice de eficiência em 12 meses melhorou de 50,7% no 3T25 para 47,2% no 3T26."],"indicadores":["Evolução do ROE e da eficiência operacional","Inadimplência, provisões e rentabilidade do crédito","Crescimento das receitas e contribuição dos seguros"],"riscos":[{"titulo":"Ciclo de crédito","texto":"Aumento da inadimplência pode elevar provisões e comprometer a recuperação da rentabilidade."},{"titulo":"Execução da transformação","texto":"Os investimentos em tecnologia e reorganização podem não gerar os ganhos de eficiência esperados."},{"titulo":"Concorrência","texto":"A competição com bancos e plataformas digitais pode pressionar margens e custos de aquisição de clientes."},{"titulo":"Seguros e capital","texto":"Sinistros, despesas assistenciais e exigências de capital podem reduzir resultados e proventos."}],"criterios":["Deterioração persistente da qualidade do crédito, comprometendo a recuperação das margens.","Ganhos de eficiência insuficientes para sustentar uma rentabilidade acima do custo de capital.","Cotação que já incorpore a recuperação esperada do banco, sem retorno potencial suficiente diante dos riscos do crédito e da execução."],"fontes":"Fontes: Bradesco, divulgações de resultados de 2023 a 2026; RI (bradescori.com.br)."},"CPLE3":{"pagina":12,"pilar_crumb":"PILAR 5 · DIVIDENDOS / ENERGIA ELÉTRICA","nome":"Copel","ticker":"CPLE3","peso":"15% do Pilar 5","resumo":"Após a privatização, a Copel passou por uma transformação de gestão e governança, com foco em eficiência, controle de custos e geração de caixa. Seus ativos de longo prazo e novos projetos contratados sustentam o potencial de crescimento e dividendos.","papel_titulo":"Renda em infraestrutura elétrica essencial","papel":"A combinação de concessões de longo prazo, receitas reguladas e maior eficiência operacional oferece previsibilidade relativa, com potencial de crescimento e remuneração recorrente aos acionistas.","questao":"A Copel conseguirá transformar os ganhos de eficiência e novos investimentos em mais caixa e dividendos, preservando sua solidez financeira?","fundamentos":[{"titulo":"Eficiência e governança pós-privatização","texto":"A transformação em companhia de capital disperso e a migração ao Novo Mercado fortaleceram a governança. O foco em produtividade, controle de custos e disciplina de capital amplia o potencial de rentabilidade."},{"titulo":"Ativos essenciais e de longo prazo","texto":"A distribuição e a transmissão oferecem receitas reguladas. Na geração, as principais hidrelétricas tiveram suas concessões renovadas até 2053, proporcionando maior horizonte de operação e investimento."},{"titulo":"Expansão com receita contratada","texto":"As ampliações de Foz do Areia e Segredo, contratadas no leilão de reserva de capacidade, acrescentam uma nova fonte de receita de longo prazo, com início previsto em 2030."}],"numeros":["A revisão tarifária de 2026 elevou a base regulatória a R$ 19,9 bilhões. Foz do Areia e Segredo somam cerca de R$ 2,6 bilhões anuais de receita bruta contratada por 15 anos, a partir de 2030. Dividendos: referência mínima de 75% do lucro, observadas as condições financeiras."],"indicadores":["Evolução dos custos e eficiência operacional","Retorno dos investimentos e remuneração regulatória","Geração de caixa, endividamento e dividendos"],"riscos":[{"titulo":"Regulação","texto":"Revisões tarifárias menos favoráveis podem reduzir a remuneração dos investimentos na distribuição."},{"titulo":"Geração e comercialização","texto":"Condições hidrológicas desfavoráveis, restrições à geração eólica e preços de energia podem pressionar os resultados."},{"titulo":"Execução dos projetos","texto":"Atrasos e custos acima do previsto podem reduzir o retorno das expansões de Foz do Areia e Segredo."},{"titulo":"Endividamento","texto":"Investimentos elevados podem pressionar a dívida e limitar a capacidade de distribuir dividendos."}],"criterios":["Perda persistente dos ganhos de eficiência e da disciplina de custos esperados após a privatização.","Investimentos com retornos insuficientes ou aumento do endividamento que comprometa a geração de caixa e os dividendos.","Cotação que já incorpore os ganhos ope  por períodos prolongados ou novos investimentos com retorno insuficiente sobre o capital empregado.","Cotação que já incorpore os ganhos de eficiência e a expansão em saneamento, sem retorno potencial suficiente diante dos riscos."],"fontes":"Fontes: Equatorial, divulgações de resultados e apresentações institucionais; RI (ri.equatorialenergia.com.br)."},"PRIO3":{"pagina":15,"pilar_crumb":"PILAR 6 · VALOR E CRESCIMENTO / PETRÓLEO E GÁS","nome":"PRIO","ticker":"PRIO3","peso":"20% do Pilar 6","resumo":"A PRIO combina aquisições disciplinadas e desenvolvimento de campos de petróleo para ampliar a produção com custos competitivos. Com os investimentos recentes entrando em operação, cresce o potencial de geração de caixa e remuneração aos acionistas.","papel_titulo":"Crescimento em petróleo e caixa por ação","papel":"A companhia oferece exposição ao crescimento da produção de petróleo, com foco em eficiência e geração de caixa. A maturação dos investimentos abre espaço para maior remuneração aos acionistas.","questao":"A PRIO conseguirá sustentar a produção e os custos competitivos, ampliando o caixa e o retorno ao acionista ao longo do ciclo do petróleo?","fundamentos":[{"titulo":"Disciplina nas aquisições","texto":"A PRIO adquire campos já descobertos, com reservas e histórico de produção conhecidos. A disciplina no preço de aquisição e na escolha dos projetos é fundamental para gerar retornos atrativos."},{"titulo":"Eficiência operacional e baixo custo","texto":"A revitalização dos campos e o aproveitamento de estruturas existentes, como em Wahoo e Frade, permitem ampliar a produção e diluir custos, fortalecendo a competitividade."},{"titulo":"Geração de caixa e remuneração futura","texto":"Com os projetos recentes em operação, a maior geração de caixa pode reduzir a dívida e abrir espaço para recompras e dividendos, conforme as oportunidades de reinvestimento."}],"numeros":["Entre 2019 e o 1S26, a produção cresceu cerca de oito vezes. No 2T26, o custo de extração foi de US$ 8,9 por barril e a alavancagem ficou em 1,5 vez dívida líquida/EBITDA."],"indicadores":["Produção, preço realizado do petróleo e custo por barril","Investimentos, geração de caixa livre e endividamento","Retorno dos projetos, aquisições e remuneração aos acionistas"],"riscos":[{"titulo":"Preço do petróleo","texto":"Quedas prolongadas do Brent ou maiores descontos no preço de venda podem comprometer margens e geração de caixa."},{"titulo":"Produção e operação dos campos","texto":"Declínio dos reservatórios, falhas operacionais ou interrupções podem reduzir a produção e elevar os custos."},{"titulo":"Disciplina nas aquisições","texto":"Novas aquisições a preços elevados podem consumir caixa e gerar retornos inferiores aos esperados."},{"titulo":"Licenciamento e investimentos","texto":"Atrasos em licenças e projetos, além de investimentos acima do previsto, podem comprometer a rentabilidade."}],"criterios":["Crescimento da produção sem melhora consistente da geração de caixa, acompanhado de elevação dos custos operacionais.","Aquisições ou investimentos que comprometam a estrutura financeira e apresentem retorno insuficiente sobre o capital empregado.","Cotação que já incorpore o crescimento e a geração de caixa esperados, sem retorno potencial suficiente diante dos riscos do negócio."],"fontes":"Fontes: PRIO, divulgações de resultados e de produção; RI (ri.prio3.com.br)."},"ALOS3":{"pagina":16,"pilar_crumb":"PILAR 6 · VALOR E CRESCIMENTO / SHOPPING CENTERS","nome":"Allos","ticker":"ALOS3","peso":"20% do Pilar 6","resumo":"A Allos reúne shoppings consolidados, receitas recorrentes e indicadores operacionais resilientes. A gestão ativa do portfólio e a disciplina financeira sustentam a geração de caixa e a remuneração aos acionistas.","papel_titulo":"Receitas imobiliárias recorrentes e proventos","papel":"Shoppings consolidados oferecem receitas relativamente previsíveis e contribuem para a resiliência da carteira. A gestão dos ativos e a distribuição de dividendos combinam geração de renda e potencial de valorização.","questao":"A Allos conseguirá sustentar dividendos atrativos e ampliar o valor por ação, preservando a qualidade dos ativos e a disciplina financeira?","fundamentos":[{"titulo":"Qualidade e resiliência dos ativos","texto":"Shoppings bem localizados, com mix diversificado de lojas e fluxo consolidado de consumidores, sustentam ocupação elevada e maior estabilidade das receitas."},{"titulo":"Receitas recorrentes e eficiência","texto":"Aluguéis e serviços oferecem previsibilidade ao resultado. A baixa vacância, a inadimplência controlada e a eficiência operacional fortalecem a geração de caixa."},{"titulo":"Alocação de capital e dividendos","texto":"A Allos tem priorizado vendas seletivas de ativos, investimentos de maior retorno e remuneração aos acionistas. Essa disciplina busca ampliar o valor por ação e sustentar os proventos."}],"numeros":["No 2T26, a ocupação foi de 96,2%, a inadimplência líquida de 1,4% e a alavancagem de 1,7 vez. Para 2026, a companhia projetou proventos mensais entre R$ 0,28 e R$ 0,30 por ação."],"indicadores":["Ocupação, inadimplência e evolução dos aluguéis","Geração de caixa recorrente e endividamento","Alocação de capital e sustentabilidade dos dividendos"],"riscos":[{"titulo":"Consumo e ocupação","texto":"Enfraquecimento do consumo pode pressionar as vendas dos lojistas, os aluguéis e a ocupação dos shoppings."},{"titulo":"Juros e financiamento","texto":"Juros elevados aumentam o custo da dívida e podem pressionar a avaliação dos ativos imobiliários."},{"titulo":"Alocação de capital","texto":"Vendas de ativos a preços desfavoráveis ou novos investimentos com baixo retorno podem comprometer a criação de valor."},{"titulo":"Sustentabilidade dos dividendos","texto":"Distribuições superiores à geração recorrente de caixa podem depender de vendas de ativos ou de maior endividamento."}],"criterios":["Deterioração persistente da ocupação, da inadimplência ou da rentabilidade dos shoppings.","Alocação de capital que comprometa o valor dos ativos, a estrutura financeira ou a sustentabilidade dos dividendos.","Cotação que já incorpore os dividendos e ganhos de eficiência esperados, sem retorno potencial suficiente diante dos riscos do negócio."],"fontes":"Fontes: Allos, divulgação de resultados do 2T26 e projeção de proventos para 2026; RI (ri.allos.com.br)."},"INBR34":{"pagina":17,"pilar_crumb":"PILAR 6 · VALOR E CRESCIMENTO / BANCO DIGITAL","nome":"Inter & Co","ticker":"INBR34","peso":"10% do Pilar 6","resumo":"O Inter já construiu uma ampla base de clientes e uma estrutura digital de baixo custo. A oportunidade está em ampliar a oferta de produtos, elevar a rentabilidade e capturar o crescimento do mercado financeiro brasileiro.","papel_titulo":"Crescimento financeiro e recuperação de rentabilidade","papel":"O Inter oferece exposição ao avanço do crédito e dos serviços financeiros, com espaço para ampliar o retorno. A posição pode se beneficiar de uma economia mais favorável, mas é mais sensível ao ciclo de crédito.","questao":"O Inter conseguirá ampliar a rentabilidade de sua base de clientes, mantendo a qualidade do crédito e a solidez financeira?","fundamentos":[{"titulo":"Escala digital e monetização","texto":"Com uma base relevante de clientes ativos, o Inter busca ampliar a utilização de crédito, investimentos e serviços financeiros, aumentando a receita gerada por cliente."},{"titulo":"Captação competitiva e eficiência","texto":"A captação de recursos a custos competitivos e a estrutura digital favorecem a expansão das operações sem aumento proporcional das despesas, ampliando o potencial de rentabilidade."},{"titulo":"Expansão do crédito e rentabilidade","texto":"A oferta de produtos mais rentáveis, como consignado privado e crédito com garantia, pode ampliar as margens e o retorno sobre o patrimônio, desde que a inadimplência permaneça controlada."}],"numeros":["No 2T26, o Inter alcançou 26,4 milhões de clientes ativos, custo de captação equivalente a 66% do CDI e ROE de 16,3%, evidenciando escala e evolução da rentabilidade."],"indicadores":["Clientes ativos e evolução da receita por cliente","Crescimento do crédito, inadimplência e margens após perdas","Eficiência operacional, capital e retorno sobre o patrimônio"],"riscos":[{"titulo":"Qualidade do crédito","texto":"A expansão para produtos mais rentáveis pode elevar a inadimplência e comprometer as margens."},{"titulo":"Ciclo econômico","texto":"Juros elevados e enfraquecimento da renda podem reduzir a demanda por crédito e a capacidade de pagamento dos clientes."},{"titulo":"Consignado privado","texto":"Mudanças de emprego e falhas na continuidade dos descontos em folha podem elevar as perdas nessa modalidade."},{"titulo":"Concorrência e capital","texto":"A competição pode pressionar os custos de captação e aquisição de clientes, enquanto o crescimento do crédito exige capital."}],"criterios":["Deterioração persistente da qualidade do crédito, comprometendo margens e rentabilidade.","Crescimento da base de clientes e do crédito sem evolução proporcional dos lucros e do retorno sobre o patrimônio.","Cotação que já antecipe a expansão da rentabilidade esperada, sem retorno potencial suficiente diante dos riscos do negócio."],"fontes":"Fontes: Inter&Co, divulgação de resultados do 2T26; RI (investors.inter.co)."},"TTEN3":{"pagina":18,"pilar_crumb":"PILAR 6 · VALOR E CRESCIMENTO / AGRONEGÓCIO E BIOCOMBUSTÍVEIS","nome":"3tentos","ticker":"TTEN3","peso":"10% do Pilar 6","resumo":"A 3tentos combina distribuição de insumos, comercialização de grãos e produção industrial, atuando em diferentes etapas do agronegócio. Com as novas fábricas em operação, o desafio é ampliar a rentabilidade e reduzir o endividamento.","papel_titulo":"Diversificação agroindustrial e expansão","papel":"A presença na distribuição de insumos, na comercialização de grãos e na indústria amplia as fontes de receita e oferece exposição diversificada ao agronegócio, com oportunidades de crescimento.","questao":"A expansão industrial conseguirá ampliar a geração de caixa, reduzir a dívida e remunerar adequadamente o capital investido?","fundamentos":[{"titulo":"Ecossistema integrado no agro","texto":"Insumos, originação e transformação industrial atuam em etapas relacionadas da cadeia, aumentando a presença junto ao produtor e diversificando receitas."},{"titulo":"Barter e relacionamento com o produtor","texto":"No barter, a companhia fornece insumos e recebe grãos na colheita. O modelo fideliza o produtor e apoia a originação, mas exige garantias, proteção de preços e gestão de crédito."},{"titulo":"Retorno dos investimentos industriais","texto":"Com as novas fábricas em operação, o aumento da produção pode melhorar as margens e ampliar a geração de caixa. O desafio é obter retornos adequados sobre os investimentos e reduzir a dívida."}],"numeros":["No 2T26, a dívida líquida chegou a R$ 3,58 bilhões. Sem a TentosCap, a alavancagem foi de 6,56x sobre o EBITDA contábil e de 3,05x sobre o EBITDA ajustado com hedge, métrica adotada durante o waiver."],"indicadores":["Utilização das fábricas e margens industriais","Capital de giro, crédito rural e estoques","Caixa, dívida líquida, alavancagem e retorno sobre capital"],"riscos":[{"titulo":"Spreads industriais e regulação","texto":"Os preços de grãos, farelo, óleo e combustíveis oscilam em sentidos distintos; a mistura obrigatória de biodiesel depende de decisão regulatória."},{"titulo":"Endividamento e covenants","texto":"Em junho de 2026, os debenturistas concederam waiver prévio do limite de 3,00x até dezembro, com teto indicativo de 3,50x na nova métrica."},{"titulo":"Execução geográfica","texto":"Novas regiões exigem relacionamento, logística e controles."},{"titulo":"Crédito ao produtor","texto":"Quebras de safra e inadimplência afetam recebíveis e barter."}],"criterios":["Retorno das fábricas persistentemente abaixo do custo de capital, sem perspectiva consistente de recuperação.","Alavancagem acima do teto acordado no waiver, novas renegociações ou estoques e inadimplência que comprometam de forma prolongada a geração de caixa.","Cotação que já incorpore os ganhos esperados das novas fábricas e a redução da dívida, sem retorno potencial suficiente diante dos riscos."],"fontes":"Fontes: 3tentos, release do 2T26 (13/08/2026) e ata da assembleia de debenturistas de 30/06/2026; RI (ri.3tentos.com.br)."},"VAMO3":{"pagina":19,"pilar_crumb":"PILAR 6 · VALOR E CRESCIMENTO / LOCAÇÃO DE CAMINHÕES, MÁQUINAS E EQUIPAMENTOS","nome":"Vamos","ticker":"VAMO3","peso":"20% do Pilar 6","resumo":"A Vamos lidera o mercado de locação de caminhões, máquinas e equipamentos pesados, com vantagens de escala e oportunidades de expansão. Seu modelo apresenta retornos atrativos, mas é sensível ao custo do financiamento.","papel_titulo":"Liderança na locação de pesados e sensibilidade a juros","papel":"A posição oferece exposição a um mercado com espaço para crescer, combinando liderança e contratos de longo prazo. A queda dos juros pode favorecer os lucros e a valorização da companhia.","questao":"A Vamos conseguirá ampliar seus resultados e o retorno ao acionista com a queda dos juros, preservando a rentabilidade dos contratos?","fundamentos":[{"titulo":"Mercado com espaço para expansão","texto":"A locação permite às empresas renovar suas frotas sem comprometer grandes volumes de capital. A baixa penetração desse modelo no Brasil oferece oportunidades de crescimento."},{"titulo":"Liderança e vantagens de escala","texto":"A liderança de mercado proporciona melhores condições de compra, estrutura de manutenção e uma ampla rede de revenda de seminovos, fortalecendo a competitividade."},{"titulo":"Rentabilidade dos contratos e juros","texto":"A Vamos busca retornos atrativos durante todo o ciclo dos ativos, da compra à revenda. Juros menores podem ampliar a diferença entre esses retornos e o custo do financiamento."}],"numeros":["A TIR-alvo dos contratos é de cerca de 22% ao ano. No 2T26, a ocupação alcançou 89% e o ROIC anualizado foi de 14,4%, aproximadamente 4 pontos percentuais acima do custo da dívida."],"indicadores":["Ocupação da frota e rentabilidade dos contratos","Retorno sobre o capital e custo do financiamento","Preços de revenda dos seminovos e endividamento"],"riscos":[{"titulo":"Juros e financiamento","texto":"Juros elevados aumentam o custo do capital, limitando a expansão e a rentabilidade dos investimentos."},{"titulo":"Valor residual dos ativos","texto":"Preços de revenda inferiores ao esperado podem reduzir o retorno obtido ao longo do ciclo de locação."},{"titulo":"Inadimplência e devoluções","texto":"Clientes inadimplentes e devoluções antecipadas podem interromper receitas e elevar os custos de realocação."},{"titulo":"Ociosidade da frota","texto":"Veículos sem contratos continuam gerando depreciação e despesas financeiras, pressionando os resultados."}],"criterios":["Retornos dos contratos e da revenda persistentemente insuficientes para remunerar o capital investido.","Aumento estrutural da ociosidade, perdas com seminovos ou deterioração da estrutura financeira.","Cotação que já incorpore os benefícios esperados de juros menores e maior ocupação, sem retorno potencial suficiente diante dos riscos."],"fontes":"Fontes: Vamos, divulgação de resultados do 2T26 e apresentação institucional; RI (ri.grupovamos.com.br)."},"BTLG11":{"pagina":20,"pilar_crumb":"PILAR 7 · FUNDOS LISTADOS / TIJOLO · GALPÕES LOGÍSTICOS","nome":"BTG Pactual Logística","ticker":"BTLG11","peso":"17,5% do Pilar 7","resumo":"Renda recorrente e criação de valor por meio de uma carteira de galpões logísticos concentrada no principal eixo de consumo do país. O fundo compra imóveis e portfólios, trabalha ocupação e contratos, renegocia aluguéis e recicla ativos quando identifica oportunidades de venda e realocação de capital.","papel_titulo":"Exposição large cap a imóveis logísticos","papel":"Combina renda contratual e potencial de ganho de capital, com escala, ampla base de cotistas e liquidez. Não é renda fixa: o resultado depende dos locatários, do mercado imobiliário e da execução da gestão.","questao":"O fundo conseguirá preservar a ocupação, elevar os aluguéis e realizar investimentos que gerem valor por cota, mantendo os riscos controlados?","fundamentos":[{"titulo":"Localização estratégica","texto":"A maior parte da ABL está próxima à capital paulista e a corredores rodoviários relevantes, atributo central para distribuição e última milha, o que ajuda a manter a vacância baixa."},{"titulo":"Locatários e contratos","texto":"A receita se distribui entre logística, alimentos e bebidas, varejo e e-commerce, e nenhum locatário domina a carteira. Contratos típicos permitem revisões; os atípicos dão previsibilidade."},{"titulo":"Gestão ativa","texto":"A gestão busca elevar aluguéis, renegociar contratos e reciclar ativos quando há oportunidades. Aquisições devem gerar retorno atrativo, com disciplina de preços e criação de valor por cota."}],"numeros":["Em setembro de 2026, o fundo reunia 35 imóveis e 1,53 milhão de m² de ABL, com 95% da área em ativos logísticos e cerca de 77% da ABL no raio de até 60 km de São Paulo. Vacância financeira de 1,1%, WAULT de 4 anos, 97% da receita indexada ao IPCA e LTV de 1,9%."],"indicadores":["Vacância financeira, reajustes e WAULT","Resultado recorrente e distribuição por cota","Retorno das aquisições, custo de capital e LTV"],"riscos":[{"titulo":"Concentração regional","texto":"A forte exposição a São Paulo amplia o impacto de choques no mesmo eixo econômico."},{"titulo":"Contratos e vacância","texto":"Contratos típicos exigem atenção a vencimentos e revisões; áreas vagas em alguns imóveis podem exigir incentivos, capex e tempo."},{"titulo":"Alocação de capital","texto":"Novas aquisições ou reciclagens com retorno insuficiente podem comprometer a geração de valor por cota."},{"titulo":"Juros e emissões","texto":"Juros elevados pressionam os preços dos imóveis e das cotas. Emissões mal precificadas podem diluir o valor econômico para o cotista."}],"criterios":["Queda persistente da ocupação, perda de poder de reajuste dos aluguéis ou deterioração do resultado recorrente por cota.","Aquisições e emissões com retorno insuficiente, diluição econômica para o cotista ou aumento relevante da alavancagem.","Cotação que já incorpore a qualidade do portfólio e os ganhos esperados da gestão, sem retorno potencial suficiente diante dos riscos."],"fontes":"Fontes: BTG Pactual Logística FII, relatório gerencial oficial de setembro de 2026, disponível no RI do BTLG11 e no Fundos.NET/B3 (fnet.bmfbovespa.com.br)."},"XPML11":{"pagina":21,"pilar_crumb":"PILAR 7 · FUNDOS LISTADOS / TIJOLO · SHOPPING CENTERS","nome":"XP Malls","ticker":"XPML11","peso":"17,5% do Pilar 7","resumo":"O XP Malls detém participações em 26 shopping centers, com mais de 5 mil lojas, concentrados no Sudeste. A estratégia combina shoppings dominantes em suas regiões com gestão ativa, comprando e vendendo participações para gerar valor.","papel_titulo":"Renda ligada ao consumo e à inflação","papel":"Os aluguéis dos lojistas são corrigidos pela inflação e incluem uma parcela variável ligada às vendas. A diversificação entre shoppings, regiões e administradoras dilui riscos específicos.","questao":"O resultado recorrente dos shoppings conseguirá sustentar os rendimentos, reduzindo a dependência de reservas e ganhos com vendas de ativos?","fundamentos":[{"titulo":"Shoppings dominantes","texto":"Ativos líderes em suas regiões tendem a preservar ocupação, fluxo de clientes e poder de negociação com os lojistas ao longo dos ciclos."},{"titulo":"Diversificação e escala","texto":"São 26 shoppings em quatro regiões do país, administrados por diferentes operadoras, o que reduz a dependência de um único ativo ou gestor."},{"titulo":"Reciclagem de capital","texto":"A gestão compra e vende participações para aprimorar o portfólio, realizar ganhos de capital e reinvestir em oportunidades atrativas. A discip
